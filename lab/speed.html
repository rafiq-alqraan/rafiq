<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>سرعة القراء</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:16px;background:#f6efdc}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e8dab2;padding:4px 8px;font-size:14px;text-align:right}</style></head><body>
<h3>سرعة القراء: مدة البقرة ١–٥ وآية الكرسي</h3><p id="st">…</p><table id="t"><tr><th>#</th><th>القارئ</th><th>الثواني</th><th>في التطبيق</th></tr></table>
<script>
const APP=['Husary_128kbps','Husary_Muallim_128kbps','Minshawy_Murattal_128kbps','Abdul_Basit_Murattal_192kbps','Maher_AlMuaiqly_64kbps','Abdurrahmaan_As-Sudais_192kbps','Saood_ash-Shuraym_128kbps','Yasser_Ad-Dussary_128kbps','Abu_Bakr_Ash-Shaatree_128kbps','Ghamadi_40kbps','Hudhaify_128kbps','Muhammad_Ayyoub_128kbps','Abdullaah_3awwaad_Al-Juhaynee_128kbps','Abdullah_Basfar_192kbps','Nasser_Alqatami_128kbps','Ahmed_ibn_Ali_al-Ajamy_128kbps_ketaballah.net','Fares_Abbad_64kbps','Ali_Jaber_64kbps','Abdul_Basit_Mujawwad_128kbps'];
const MORE=['Abdullah_Matroud_128kbps','Mohammad_al_Tablaway_128kbps','Salah_Al_Budair_128kbps','Salaah_AbdulRahman_Bukhatir_128kbps','Muhammad_Jibreel_128kbps','Khaalid_Abdullaah_al-Qahtaanee_192kbps','Akram_AlAlaqimy_128kbps','Hani_Rifai_192kbps','Ibrahim_Akhdar_32kbps','Muhsin_Al_Qasim_192kbps','Karim_Mansoori_40kbps','Ayman_Sowaid_64kbps','Mahmoud_Ali_Al_Banna_32kbps','Abdullah_Basfar_32kbps','Alafasy_128kbps','Mustafa_Ismail_48kbps','Aziz_Alili_128kbps','Yaser_Salamah_128kbps','Nabil_Rifa3i_48kbps','Sahl_Yassin_128kbps','Muhammad_AbdulKareem_128kbps','Abdullah_Ali_Jabir_128kbps','Abdurrahmaan_As-Sudais_64kbps','Ali_Hajjaj_AlSuesy_128kbps','Abdulkareem_Al_Hazmi_128kbps','Khalefa_Al_Tunaiji_64kbps','Bandar_Baleela_64kbps','Ahmed_Neana_128kbps','Fatih_Seferagic_48kbps','Mahmoud_Ali_Al_Banna_32kbps'];
const AY=['002001','002002','002003','002004','002005','002255'];
(async()=>{ const rows=[]; const all=[...APP.map(r=>[r,1]),...MORE.filter(r=>!APP.includes(r)).map(r=>[r,0])]; let i=0;
 for(const [r,inApp] of all){ i++; document.getElementById('st').textContent=`${i}/${all.length} ${r}`; let sec=0, ok=true;
   for(const a of AY){ try{ const res=await fetch(`https://everyayah.com/data/${r}/${a}.mp3`); if(!res.ok){ok=false;break;} const b=await new OfflineAudioContext(1,16000,16000).decodeAudioData(await res.arrayBuffer()); sec+=b.duration; }catch(e){ ok=false; break; } }
   if(ok) rows.push([r,sec,inApp]); }
 rows.sort((a,b)=>a[1]-b[1]); const t=document.getElementById('t'); rows.forEach(([r,s,inApp],k)=>t.insertAdjacentHTML('beforeend',`<tr><td>${k+1}</td><td dir="ltr">${r}</td><td>${s.toFixed(0)}</td><td>${inApp?'✓':''}</td></tr>`));
 document.getElementById('st').textContent='تم';
})();
</script></body></html>
