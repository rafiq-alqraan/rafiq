<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة التحقق من الكلمات</title>
<style>body{font-family:system-ui,sans-serif;background:#f6efdc;color:#2a2315;max-width:720px;margin:auto;padding:16px;line-height:1.9}.m{color:#7a6e55;font-size:13px}div.r{background:#fff9e9;border:1px solid #e8dab2;border-radius:10px;padding:8px 12px;margin:8px 0}.w{display:inline-block;margin:0 4px;padding:0 6px;border-radius:6px}.ok{background:#d5eedd}.bad{background:#f6d0d0}.mid{background:#f5e6b8}</style></head><body>
<h3>تجربة التحقق من الكلمة المتوقعة (نموذج CTC)</h3><p class="m" id="st">…</p><div id="out"></div>
<script>
const MODEL='mostafanewir70/quran-recitation-ctc-onnx', URLT='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/dist/transformers.min.js';
const st=t=>document.getElementById('st').textContent=t;
// letter groups so spelling differences (hamza seats, alef forms, ta marbuta) don't count as mistakes
const GRP={'ا':'ا','أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ء':'ء','ؤ':'ء','ئ':'ء','ى':'ي','ي':'ي','ة':'ه','ه':'ه'};
const LET='ءآأؤإئابةتثجحخدذرزسشصضطظعغفقكلمنهوىيٱ';
const g=c=>GRP[c]||c;
const letters=w=>[...w.normalize('NFC')].filter(c=>LET.includes(c)).map(g);
const TESTS=[ // [ayah, expected text (what the reciter should say)]
 [1,'قل هو الله أحد'],[2,'الله الصمد'],[3,'لم يلد ولم يولد'],[4,'ولم يكن له كفوا أحد'],
 [1,'قل هو الله واحد',true],[3,'لم يلد ولم يخلق',true],[4,'ولم يكن له مثلا أحد',true]];
(async()=>{
  if(!crossOriginIsolated && 'serviceWorker' in navigator && !sessionStorage.getItem('coi')){ sessionStorage.setItem('coi','1'); await navigator.serviceWorker.register('coi-sw.js'); await navigator.serviceWorker.ready; location.reload(); return; }
  const thr=crossOriginIsolated?Math.min(4,navigator.hardwareConcurrency||2):1;
  st(`isolated ${crossOriginIsolated} · threads ${thr} · loading model (~240MB first time)…`);
  const T=await import(URLT); T.env.allowLocalModels=false; T.env.backends.onnx.wasm.numThreads=thr;
  let last=0; const prog=p=>{ if(p.total && Date.now()-last>500){ last=Date.now(); st(`loading ${p.file} ${Math.round(100*p.loaded/p.total)}%`); } };
  const PR=await T.AutoProcessor.from_pretrained(MODEL,{progress_callback:prog});
  const MD=await T.AutoModelForCTC.from_pretrained(MODEL,{dtype:'q4',device:'wasm',progress_callback:prog});
  const vocab=await (await fetch(`https://huggingface.co/${MODEL}/resolve/main/vocab.json`)).json(); const id2c=[]; for(const [c,i] of Object.entries(vocab)) id2c[i]=c;
  st(`isolated ${crossOriginIsolated} · threads ${thr} · ready`);
  const out=document.getElementById('out'), cache={};
  for(const [a,text,wrong] of TESTS){
    let pcm=cache[a]; if(!pcm){ const ab=await (await fetch(`https://everyayah.com/data/Husary_128kbps/112${String(a).padStart(3,'0')}.mp3`)).arrayBuffer();
      const buf=await new OfflineAudioContext(1,16000,16000).decodeAudioData(ab); const oc=new OfflineAudioContext(1,Math.ceil(buf.duration*16000),16000), s=oc.createBufferSource(); s.buffer=buf; s.connect(oc.destination); s.start(); pcm=cache[a]=new Float32Array((await oc.startRendering()).getChannelData(0)); }
    const t0=performance.now(); const inp=await PR(pcm); const o=await MD(inp); const t1=performance.now();
    const L=o.logits, [ ,TT,V]=L.dims, D=L.data;
    // reduced log-probs per frame: blank (pad + diacritics + separators) and one per letter group
    const keys=[...new Set([...LET].map(g))], K=keys.length, lp=new Float32Array(TT*(K+1)); let greedy='';
    for(let t=0;t<TT;t++){ let mx=-1e9; for(let v=0;v<V;v++) mx=Math.max(mx,D[t*V+v]); const p=new Float64Array(K+1); let z=0, best=0, bv=-1;
      for(let v=0;v<V;v++){ const e=Math.exp(D[t*V+v]-mx); z+=e; const c=id2c[v]; const k=c&&LET.includes(c)?keys.indexOf(g(c)):-1; p[k+1]+=e; if(D[t*V+v]>bv){bv=D[t*V+v];best=v;} }
      for(let k=0;k<=K;k++) lp[t*(K+1)+k]=Math.log(Math.max(p[k]/z,1e-12)); const c=id2c[best]; if(c&&c!=='<pad>') greedy+=c==='|'?' ':c; }
    // forced alignment (CTC Viterbi) of the expected letters; each letter may be skipped with a penalty
    const words=text.split(' '), lab=[], wOf=[]; words.forEach((w,i)=>letters(w).forEach(c=>{ lab.push(keys.indexOf(c)+1); wOf.push(i); }));
    const S=2*lab.length+1, NEG=-1e9, SKIP=-6; let prev=new Float64Array(S).fill(NEG), cur; const bp=[];
    const em=(t,s)=>s%2===0?lp[t*(K+1)]:lp[t*(K+1)+lab[(s-1)/2]];
    prev[0]=em(0,0); if(S>1) prev[1]=em(0,1);
    for(let t=1;t<TT;t++){ cur=new Float64Array(S).fill(NEG); const b=new Int32Array(S);
      for(let s=0;s<S;s++){ let best=prev[s], from=s;
        if(s>0 && prev[s-1]>best){ best=prev[s-1]; from=s-1; }
        if(s>1 && s%2===1 && lab[(s-1)/2]!==lab[(s-3)/2] && prev[s-2]>best){ best=prev[s-2]; from=s-2; }
        if(s>3 && s%2===1 && prev[s-4]+SKIP>best){ best=prev[s-4]+SKIP; from=s-4; }
        cur[s]=best+em(t,s); b[s]=from; }
      bp.push(b); prev=cur; }
    let s=prev[S-1]>prev[S-2]?S-1:S-2; const path=new Int32Array(TT); for(let t=TT-1;t>=0;t--){ path[t]=s; if(t>0) s=bp[t-1][s]; }
    // per-word score: mean over its frames of log p(expected letter) minus log p(best other letter)
    const sc=words.map(()=>[0,0]);
    for(let t=0;t<TT;t++){ const st2=path[t]; if(st2%2===0) continue; const li=(st2-1)/2, k=lab[li]; let bo=-1e9; for(let j=1;j<=K;j++) if(j!==k) bo=Math.max(bo,lp[t*(K+1)+j]); bo=Math.max(bo,lp[t*(K+1)]); sc[wOf[li]][0]+=Math.min(0,lp[t*(K+1)+k]-bo); sc[wOf[li]][1]++; }
    const seen=words.map((w,i)=>sc[i][1]);
    const html=words.map((w,i)=>{ const n=sc[i][1], v=n?sc[i][0]/n:-99, need=letters(w).length; const cov=n/Math.max(1,need); const cls=(v>-1.5&&cov>=0.6)?'ok':(v>-4&&cov>=0.4)?'mid':'bad'; return `<span class="w ${cls}">${w} <span class="m" dir="ltr">${v.toFixed(1)} ${n}/${need}</span></span>`; }).join(' ');
    out.insertAdjacentHTML('beforeend',`<div class="r"><b>${a}${wrong?' (نص خطأ متعمد)':''}</b> ${html}<br><span class="m">سمع: ${greedy} · <span dir="ltr">${Math.round(t1-t0)} ms · audio ${(pcm.length/16000).toFixed(1)}s · frames ${TT}</span></span></div>`);
  }
})().catch(e=>st('خطأ: '+(e.message||e)));
</script></body></html>
