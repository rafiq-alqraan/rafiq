name: نشر خادم التسميع (Modal)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-recite-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-recite-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Modal
        run: pip install "modal>=1.0,<2"
      - name: Deploy
        run: modal deploy server/recite_server.py 2>&1 | tee deploy.log
      - name: Check the server answers
        run: |
          URL=$(grep -oE 'https://[a-z0-9-]+--rafiq-recite-web[a-z0-9-]*\.modal\.run' deploy.log | head -1)
          echo "Server URL: $URL"
          echo "### رابط خادم التسميع: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 120 "$URL/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "server did not answer /health" >&2; exit 1
