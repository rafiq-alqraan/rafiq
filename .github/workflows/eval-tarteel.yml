name: مقارنة نموذج ترتيل المفتوح
on:
  push:
    branches: [eval-tarteel]
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet "transformers<5" librosa numpy
      - run: python eval/tarteel_whisper.py
