function rcPaint(){ const el=document.getElementById('rcw'); if(!el) return; el.innerHTML=rcWords(); const c=el.querySelector('.w.c')||[...el.querySelectorAll('.w.ok,.w.e,.w.m')].pop(); c?.scrollIntoView({block:'nearest',behavior:'smooth'}); }
function rcStatus(m){ ui.rc.msg=m; const el=document.getElementById('rcst'); if(el) el.textContent=m; }
let REC=null;
function stopRec(){ if(ui.rc) ui.rc.on=false; if(REC){ try{ REC.onend=null; REC.abort(); }catch(e){} REC=null; } }
function rcUpdate(final){ const rc=ui.rc; const i=alignRec(rc.W, rc.segs.join(' '), final); rcPaint();
  if(i>=rc.W.length && final){ finishRec(); } }
function startRec(){
  const rc=ui.rc; if(!SR||!rc) return;
  const r=new SR(); REC=r; r.lang='ar-SA'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
  const idx=rc.segs.length; rc.segs.push('');
  r.onresult=ev=>{ let t=''; for(let k=0;k<ev.results.length;k++) t+=ev.results[k][0].transcript+' '; rc.segs[idx]=t; const fin=ev.results[ev.results.length-1].isFinal; rcUpdate(fin); };
  r.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ rc.on=false; rcStatus('اسمح للتطبيق باستخدام المايكروفون من إعدادات المتصفح، ثم حاول مرة ثانية.'); rerender(); }
    else if(ev.error==='network'){ rc.on=false; rcStatus('التسميع يحتاج اتصال إنترنت.'); rerender(); }
    else if(ev.error==='language-not-supported'){ rc.on=false; rcStatus('جهازك ما يدعم التعرّف على العربي. فعّل لغة الإملاء العربية من الإعدادات.'); rerender(); } };
  r.onend=()=>{ REC=null; if(rc.on && ui.rc===rc && route().startsWith('recite-')) { try{ startRec(); }catch(e){ rc.on=false; rerender(); } } };
  try{ r.start(); }catch(e){}
}
function finishRec(){ const rc=ui.rc; stopRec(); rc.done=true; rc.msg=''; rerender(); document.getElementById('rcsum')?.scrollIntoView({block:'nearest',behavior:'smooth'}); }
function rcSummary(){
  const W=ui.rc.W, n=W.length, ok=W.filter(w=>w.st==='ok').length, bad=W.filter(w=>w.st==='e'||w.st==='m'), read=W.filter(w=>w.st!=='p'&&w.st!=='h').length;
  const pct=n?Math.round(ok/n*100):0;
  if(!ui.rc.saved && read>=Math.min(n,5)){ ui.rc.saved=1; try{ const r=rcBest(); r.a=(r.a||0)+1; if(pct>=80) r.n=(r.n||0)+1; if(pct>=100) r.p=(r.p||0)+1; r.best=Math.max(r.best||0,pct); localStorage.setItem('rafiq-rc',JSON.stringify(r)); }catch(e){} }
  const head = pct>=95?'ما شاء الله، تسميع متقن!':pct>=80?'أحسنت، تسميع ممتاز':pct>=50?'بداية طيبة، واصل':'كل محاولة تقرّبك، أعدها مرة ثانية';
  const fr=ui.rc.from, can = fr && state.plans[fr.pid] && pct>=80;
  return `<div class="card rcs"><b>${head}</b><div class="rcpct">${f(pct)}٪</div>
    <div class="small muted">${f(ok)} كلمة صحيحة من ${f(n)}${read<n?` · بقي ${f(n-read)} لم تُقرأ`:''}</div>
    ${bad.length?`<div class="sec-l">كلمات تحتاج مراجعة</div><div class="rcbad">${bad.slice(0,30).map(w=>`<span>${esc(w.t)}</span>`).join('')}</div>`:''}
    <div class="row" style="gap:8px;justify-content:center;margin-top:12px">${read<n?`<button class="btn ghost" data-act="rcCont">كمّل من حيث وقفت</button>`:''}<button class="btn ghost" data-act="rcReset">${read<n?'من البداية':'سمّع مرة ثانية'}</button>${can?`<button class="btn" data-act="rcDone">سجّلها منجزة</button>`:''}</div></div>`;

const shuf=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const qzWords=id=>QT[id-1].split(/\s+/).filter(w=>qnorm(w));
const qzCut=(ws,a,n)=>ws.slice(a,a+n).join(' ')+(ws.length>a+n?' …':'');
const qzEnd=id=>{ const ws=qzWords(id), c=Math.min(Math.ceil(ws.length/2),8); return qzCut(ws,c,8); };
const qzStart=id=>qzCut(qzWords(id),0,6);
const qzShow=id=>{ const ws=qzWords(id); return ws.length>22?'… '+ws.slice(-16).join(' '):QT[id-1]; };
const qzRoute=rs=>{ const ids=[...new Set(plIds(rs))].sort((a,b)=>a-b), out=[]; for(const id of ids){ const l=out[out.length-1]; if(l&&l[1]===id-1) l[1]=id; else out.push([id,id]); } return 'quiz-'+out.map(x=>x.join('-')).join('_'); };

  return out.length===2?shuf([ok,...out]):null; }

  const lo=Math.max(1,ids[0]-40), hi=Math.min(NA,ids[ids.length-1]+40);
  const near=Array.from({length:hi-lo+1},(_,i)=>lo+i), pool=ids.length>=8?ids:near;
  const long=x=>qzWords(x).length>=4;
  const mk={
    c:id=>{ if(!long(id)) return null; const ws=qzWords(id), c=Math.min(Math.ceil(ws.length/2),8), ok=qzEnd(id);
      const ch=qzPick(ok,pool.filter(x=>x!==id&&long(x)),qzEnd); return ch&&{t:'أكمل الآية',p:ws.slice(0,c).join(' ')+' …',ch,ok,id}; },
    n:id=>{ if(id>=NA||sOf[id+1]!==sOf[id]) return null; const ok=qzStart(id+1);
      const ch=qzPick(ok,pool.filter(x=>x!==id+1&&x!==id),qzStart); return ch&&{t:'ما الآية التي بعدها؟',p:qzShow(id),ch,ok,id:id+1}; },
    s:id=>{ const s=sOf[id], ss=[...new Set(near.map(x=>sOf[x]))].filter(x=>x!==s), more=[s-2,s-1,s+1,s+2].filter(x=>x>=1&&x<=114&&x!==s);
      const ch=qzPick(NAMES[s-1],ss.length>=2?ss:[...new Set([...ss,...more])],x=>NAMES[x-1]); return ch&&{t:'من أي سورة هذه الآية؟',p:qzShow(id),ch,ok:NAMES[s-1],id}; }
  };

  for(let r=0;r<3&&qs.length<10;r++) order.forEach((id,i)=>{ if(qs.length>=10) return; const k=T[(i+r)%3]; if(used.has(id+k)) return; const q=mk[k](id); if(q){ used.add(id+k); qs.push(q); } });

}

function toggleSession(plan,k){
  const s=compute(plan).sessions[k], all=sessDone(plan,s), now=Date.now();

  put(plan);
}

function toggleTask(plan,k,i){

  put(plan);
}

  if(t.id==='grPlan'){ setGroupPlan(t.dataset.code,t.value).then(()=>{ toast('تم'); grFill(t.dataset.code); }).catch(()=>toast('تعذّر الاتصال، تأكد من الإنترنت')); return; }
  if(t.id==='audR'){ const o=audOpts(); o.r=t.value; audSave(o); plBar(); if(route()==='today') rerender(); return; }
  if(t.id==='dlA'||t.id==='dlB'||t.id==='dlR'){ dlShow(); return; }
  if(t.id==='note' && ui.sess){ setRec({n:t.value.slice(0,500)}); return; }
  const form=t.closest('#newf'); if(form) syncForm(form,t);
});
let aqT=null;
document.addEventListener('input',e=>{ if(e.target.id==='aq'){ ui.aq=e.target.value; clearTimeout(aqT); aqT=setTimeout(()=>{ const el=document.getElementById('aqr'); if(el) el.innerHTML=aqResults(); },200); return; }
  if(e.target.id==='mq'){ ui.mq=e.target.value; const pos=e.target.selectionStart; rerender(); const el=document.getElementById('mq'); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } return; }
  const form=e.target.closest('#newf'); if(form && e.target.type==='number') syncForm(form); });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(sheetRoot.innerHTML){ closeSheet(); rerender(); } else if(ui.menu){ ui.menu=null; rerender(); } });
document.addEventListener('submit',e=>{
  if(e.target.id==='authf'){ e.preventDefault(); submitAuth(e.target); return; }
  if(e.target.id==='joinf'){ e.preventDefault(); submitJoin(e.target); return; }
  if(e.target.id==='grf'){ e.preventDefault(); submitGroupNew(e.target); return; }
  if(e.target.id==='proff'){ e.preventDefault(); submitProfile(e.target); return; }
  if(e.target.id==='supf'){ e.preventDefault(); submitSupport(e.target); return; }
  if(e.target.id==='ratef'){ e.preventDefault(); submitRate(e.target); return; }
  if(e.target.id!=='newf') return;
  e.preventDefault(); const plan=planFromForm(e.target);
  if(plan.err){ toast(plan.err); return; } delete plan.err;
  if(!buildSeq(isCycle(plan)?plan.review.range:plan.hifz.range).length){ toast('اختر نطاقاً فيه آيات'); return; }
  const editId=e.target.dataset.edit;
  if(editId && state.plans[editId]){ const old=state.plans[editId];
    plan.id=old.id; plan.created=old.created; plan.status=old.status==='complete'?'active':old.status; plan.rec=old.rec; cache.delete(plan.id); carryOver(old,plan);
    const st=stats(plan), t=todayIso(); if(st.firstOpen>0) plan.anchor={k:st.firstOpen,date:plan.start>t?plan.start:t};
    put(plan); toast('حُفظ التعديل'); location.hash='#plan-'+plan.id; return; }
  plan.code=newCode(); const jc=ui.joinCode; ui.joinCode=null;
  put(plan); if(jc){ joinGroup(jc,plan.id).then(()=>{ toast('بدأت الخطة وانضممت للحلقة'); location.hash='#group-'+jc; }).catch(()=>toast('بدأت الخطة، وتعذّر الانضمام للحلقة')); return; }
  toast('بدأت الخطة، بارك الله لك'); location.hash='#today';
});

/* reload into a newer version when the site was updated while this page stayed open */
async function checkUpdate(){ if(!FB || !navigator.onLine) return; try{ const t=await (await fetch('index.html?v='+Date.now(),{cache:'no-store'})).text(); const m=t.match(/const APP_VER='([^']+)'/); if(m && m[1]!==APP_VER && !document.querySelector('.sheet') && !document.activeElement?.matches('input,textarea,select')) location.reload(); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
setTimeout(checkUpdate,4000);
setTimeout(()=>{ if(navigator.onLine) loadQuran().catch(()=>{}); },6000);
