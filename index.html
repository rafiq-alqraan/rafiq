<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#118A88"><meta name="description" content="ربيع القرآن: خطة حفظ ومراجعة القرآن، وردك كل يوم">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ربيع القرآن">
<style>*{box-sizing:border-box}html,body{margin:0}</style></head><body>
<title>ربيع القرآن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-app shell. Screen header on top, content column, fixed bottom tab bar with a + button; sheets slide up from the bottom. */
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --raised:#E9EFEF; --ink:#13201F; --muted:#5D6B6A; --line:#DCE4E3;
  --accent:#118A88; --accent-ink:#FFFFFF; --soft:#D5EEED;
  --h:#118A88; --f:#C9821B; --t:#6B7FD6; --n:#4E9A5B;
  --warn:#C9433A; --warn-soft:#F7DEDC; --ok:#2F8F4E; --ok-soft:#DBF0E2;
  --f-display:"Amiri","Traditional Arabic",serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(10,30,30,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A1B; --surface:#1A2425; --raised:#223031; --ink:#E4EDEC; --muted:#8FA09F; --line:#2A3839;
  --accent:#3CC2BD; --accent-ink:#06201F; --soft:#173B3A;
  --h:#3CC2BD; --f:#E5A443; --t:#95A6F2; --n:#77C489;
  --warn:#EF6F64; --warn-soft:#3E2220; --ok:#5ACB7D; --ok-soft:#183627; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A1B; --surface:#1A2425; --raised:#223031; --ink:#E4EDEC; --muted:#8FA09F; --line:#2A3839;
  --accent:#3CC2BD; --accent-ink:#06201F; --soft:#173B3A;
  --h:#3CC2BD; --f:#E5A443; --t:#95A6F2; --n:#77C489;
  --warn:#EF6F64; --warn-soft:#3E2220; --ok:#5ACB7D; --ok-soft:#183627; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding-block:12px 10px}
.topbar h1{margin:0;text-align:center;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{display:block;text-align:center;font-size:12px;color:var(--muted);font-weight:400}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);scroll-margin-top:70px}
.muted{color:var(--muted)} .small{font-size:13px}
h2{font-size:15px;margin:6px 2px 0;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
h2 .count{font-size:12px;background:var(--soft);border-radius:99px;padding:0 8px;color:var(--accent)}
h3{margin:0;font-size:16px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.acc{background:var(--soft);color:var(--accent);border-color:transparent}
.bar{height:6px;background:var(--raised);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.late>i{background:var(--warn)}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:13px;color:var(--muted)}
.tile.wide{grid-column:1/-1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;width:26px;height:26px;margin:2px auto 0;border-radius:50%;border:1px solid var(--line);font-style:normal;line-height:24px}
.week i.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.week i.today{border-color:var(--accent);border-width:2px}
.tile-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:8px 18px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn.block{width:100%;justify-content:center;padding:12px}
.btn.sm{padding:4px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* session card */
.sess{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:70px}
.sess.today{border-color:var(--accent)}
.sess.done{opacity:.72}
.circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.circle.on{background:var(--accent);border-color:var(--accent)}
.circle.on::after{content:"";width:8px;height:13px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.circle.part{border-color:var(--accent);background:conic-gradient(var(--accent) var(--p),transparent 0)}
.sess .main{min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:start;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.sess .num{font-weight:700;font-size:14px;white-space:nowrap}
.sess .num small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.sess .lines{min-width:0;display:flex;flex-direction:column;gap:2px}
.ln{font-size:14px;overflow-wrap:anywhere;line-height:1.5}
.ln b{font-weight:700}
.ln.h b{color:var(--h)} .ln.f b,.ln.r b{color:var(--f)} .ln.n b{color:var(--n)} .ln.t b{color:var(--t)}
.ln.done{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.amt{font-size:12px;color:var(--muted);white-space:nowrap;text-align:center}
.plan-tag{grid-column:1/-1;font-size:12px;color:var(--muted)}
/* plan header */
.ph-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.track{position:relative;margin:26px 0 8px}
.track .bar{height:10px}
.track .mark{position:absolute;top:-24px;transform:translateX(50%);font-size:11px;background:var(--raised);border-radius:99px;padding:1px 8px;white-space:nowrap}
.track .mark::after{content:"";position:absolute;bottom:-6px;right:50%;width:2px;height:6px;background:var(--muted)}
.ends{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-size:13px;align-items:start}
.ends>div{min-width:0}
.ends b{display:block;font-size:14px}
.ends span{color:var(--muted);font-size:12px}
.ends .mid{text-align:center}
.ends .end{text-align:left}
.stage{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.stage-l{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.stage-l b{color:var(--accent);font-variant-numeric:tabular-nums}
.pop{position:absolute;top:calc(100% - 2px);inset-inline-end:0;z-index:20;width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
.pop>a,.pop>button{display:block;text-align:start;padding:11px 12px;border-radius:10px;border:0;background:none;color:var(--ink);text-decoration:none;font:inherit;font-size:15px;cursor:pointer}
.pop>a:hover,.pop>button:hover{background:var(--raised)}
.pop>.danger{color:var(--warn)}
.pop-sec{font-size:12px;color:var(--muted);padding:8px 12px 4px;border-top:1px solid var(--line);margin-top:4px}
.pop-stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 6px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.pop-stages button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 0;font:inherit;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.pop-stages button small{font-size:10px;color:var(--muted)}
.pop-stages button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.pop #delc .card{margin:4px}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:5px;border-radius:9px;background:var(--raised)}
.segs i.on{background:var(--accent)}
.tmain .prog{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:6px}
.tmain .prog .segs{flex:1;max-width:240px}
.tmain .prog small{font-size:12px;color:var(--muted);white-space:nowrap}
.stepbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.stepbtns button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;font-size:14px;cursor:pointer}
.stepbtns button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.krow{display:grid;grid-template-columns:6.5em 1fr 3.2em;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.krow .bar{height:8px}
.krow small{color:var(--muted);font-size:12px;grid-column:2/-1;margin-top:-6px}
.carry{font-size:12px;color:var(--f);padding:6px 0 0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--raised);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.menu button{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;font-size:14px}
.menu button small{display:block;color:var(--muted);font-size:12px}
.menu button.on{border-color:var(--accent);background:var(--soft)}
.listbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.listbtn>span{flex:1;min-width:0}
.listbtn svg{width:22px;height:22px;flex:none;color:var(--accent)}
.listbtn.danger svg{color:var(--warn)}
.listbtn small{display:block;color:var(--muted);font-size:12px}
.listbtn.danger{color:var(--warn)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .wd{color:var(--muted);font-size:12px}
.cal .d{aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;position:relative;font-variant-numeric:tabular-nums;border:0;background:none;padding:0}
.cal .d.s{cursor:pointer;background:var(--raised)}
.cal .d.s::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);margin-top:2px}
.cal .d.s.ok::after{background:var(--ok)}
.cal .d.s.late::after{background:var(--warn)}
.cal .d.now{outline:2px solid var(--accent)}
/* plans list */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.filters button.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pcard{display:block;color:inherit;text-decoration:none}
.pcard .t{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pcard .t h3{display:flex;align-items:center;gap:8px;min-width:0}
.pcard .t h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.pcard.paused .t h3::before{background:var(--f)} .pcard.complete .t h3::before{background:var(--ok)} .pcard.archived .t h3::before{background:var(--muted)}
.pcard .r{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin:6px 0 6px;flex-wrap:wrap}
/* templates */
.tpls{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,46%);gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.tpl{scroll-snap-align:start;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.tpl .art{height:74px;background:var(--soft);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;color:var(--accent)}
.tpl .bd{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.tpl .bd b{font-size:14px}
.tpl .bd small{color:var(--muted);font-size:12px;line-height:1.4}
.tpl.on{border-color:var(--accent);outline:1px solid var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
/* form / wizard */
.steps{display:flex;justify-content:space-between;align-items:center;position:relative;margin:4px 8px 6px}
.steps::before{content:"";position:absolute;inset:50% 0 auto;border-top:1px dashed var(--line)}
.steps span{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--raised);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-weight:600;font-size:14px}
select,input[type=number],input[type=date],input[type=time],input[type=text],input[type=tel],input[type=email],input[type=password],input[type=search],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;max-width:100%;width:100%}
textarea{min-height:70px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;background:var(--surface);font-size:14px}
.opt span small{display:block;color:var(--muted);font-size:12px}
.opt input:checked+span{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--accent)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types .opt span{height:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.preview{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .grip{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.sheet-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-bottom:10px}
.sheet-head h3{text-align:center}
.sheet-head .sub{display:block;text-align:center;font-size:12px;color:var(--muted);font-weight:400}
.icon-btn.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs2{display:flex;background:var(--raised);border-radius:99px;padding:3px;margin-bottom:12px}
.tabs2 button{flex:1;border:0;background:transparent;border-radius:99px;padding:7px;cursor:pointer;color:var(--muted)}
.tabs2 button.on{background:var(--surface);color:var(--accent);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--raised);border-radius:12px;padding:10px 12px;cursor:pointer;border:0;width:100%;text-align:start}
.toggle .circle{pointer-events:none}
.stars{display:flex;gap:8px;justify-content:center;direction:ltr}
.stars button{border:0;background:none;cursor:pointer;padding:2px;font-size:30px;line-height:1;color:var(--line)}
.stars button.on{color:var(--f)}
.counter{display:flex;align-items:center;justify-content:center;gap:18px}
.counter button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-size:20px}
.counter b{font-size:24px;min-width:2ch;text-align:center;color:var(--ok);font-variant-numeric:tabular-nums}
.sec-l{font-size:13px;color:var(--accent);font-weight:600;margin:14px 0 6px}
/* stats */
.ring-wrap{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{font-size:16px;font-variant-numeric:tabular-nums}
.surahs{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}
.surahs .s{display:grid;grid-template-columns:5.5em 1fr 4.5em;gap:8px;align-items:center;font-size:13px}
.surahs .s span:last-child{color:var(--muted);text-align:left;font-variant-numeric:tabular-nums}
.sbar{height:8px;background:var(--raised);border-radius:99px;overflow:hidden;display:flex}
.sbar i{height:100%}
.chart{width:100%;height:auto;display:block}
/* bottom nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;padding:8px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;pointer-events:auto}
.nav .tabs{flex:1;display:flex;justify-content:space-around;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.nav .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);text-decoration:none;border-radius:99px;padding:5px 4px}
.nav .tabs a svg{width:21px;height:21px}
.nav .tabs a.on{background:var(--soft);color:var(--accent);font-weight:600}
.nav .fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,.18);flex:none}
.nav .fab svg{width:26px;height:26px}
.empty{text-align:center;padding:26px 14px}
.empty .orn{font-family:var(--f-display);font-size:42px;color:var(--accent);line-height:1}

const todayIso = () => iso(new Date());
const fmtG = s => parse(s).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
const fmtShort = s => parse(s).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
let fmtH; try{ const hf=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}); fmtH=s=>hf.format(parse(s)); }catch(e){ fmtH=()=> ''; }

/* ---------- sequences & chunks ---------- */
/* earlier memorisation is ordered like the new memorisation, so its last part is the bit next to where today's memorising starts */
function orient(ids,dir){
  const sorted=[...ids].sort((x,y)=>x-y); if(dir!=='rev') return sorted;
  const groups=[]; for(const id of sorted){ const g=groups[groups.length-1]; if(g && sOf[g[0]]===sOf[id]) g.push(id); else groups.push([id]); }
  return groups.reverse().flat();
}
function buildSeq(r){
  if(!r || r.type==='none') return [];
  if(r.type==='span'){ // from (s1,a1) to (s2,a2); s1>s2 means memorising upward, surah by surah
    const clampA=(s,a)=>Math.max(1,Math.min(S[s][1],a||1));
    let {s1,a1,s2,a2}=r; a1=clampA(s1,a1); a2=clampA(s2,a2);
    const id=(s,a)=>S[s][0]+a-1, ids=[];
    if(s1<s2 || (s1===s2 && a1<=a2)){ for(let i=id(s1,a1);i<=id(s2,a2);i++) ids.push(i); return ids; }
    if(s1===s2){ for(let i=id(s1,a2);i<=id(s1,a1);i++) ids.push(i); return ids; }
    for(let s=s1;s>=s2;s--){ const lo= s===s2?1:(s===s1?a1:1), hi = s===s2?a2:S[s][1]; for(let a=lo;a<=hi;a++) ids.push(id(s,a)); }
    return ids;
  }
  const segs=[];
  if(r.type==='juz'){ const a=Math.min(r.from,r.to), b=Math.max(r.from,r.to), lo=JZ[a], hi=JZ[b+1]-1;
    // split into surah pieces so "from An-Nas upward" walks surah by surah
    for(let id=lo; id<=hi; ){ const s=sOf[id], end=Math.min(hi, S[s][0]+S[s][1]-1); segs.push([id,end]); id=end+1; } }
  else { const a=r.type==='all'?1:Math.min(r.from,r.to), b=r.type==='all'?114:Math.max(r.from,r.to); for(let s=a;s<=b;s++) segs.push([S[s][0],S[s][0]+S[s][1]-1]); }
  if(r.dir==='rev') segs.reverse();
  const ids=[]; for(const [x,y] of segs) for(let i=x;i<=y;i++) ids.push(i);
  return ids;
}
function chunk(ids, amt, unit){
  const out=[], n=ids.length; let i=0;
  while(i<n){
    let acc=0, j=i;
    while(j<n){
      const w=W(ids[j],unit);
      if(acc+w>amt+1e-6 && j>i){ if(acc+w-amt < amt-acc){acc+=w;j++;} break; }
      acc+=w; j++;
      if(acc>=amt-1e-6) break;
    }
    out.push([i,j-1]); i=j;
  }
  if(out.length>1){ const t=out[out.length-1]; let tw=0; for(let k=t[0];k<=t[1];k++) tw+=W(ids[k],unit);
    if(tw<amt*0.25){ out.pop(); out[out.length-1][1]=t[1]; } }
  return out;
}
const seqWeight = ids => ids.reduce((a,id)=>a+pw(id),0);

/* a slice of a sequence -> contiguous runs of ayah ids */
function runs(ids,i0,i1){
  const r=[]; let a=ids[i0], b=a;
  for(let k=i0+1;k<=i1;k++){ const id=ids[k]; if(id===b+1 && sOf[id]===sOf[b]) b=id; else if(id===b+1){ b=id; } else { r.push([a,b]); a=b=id; } }
  r.push([a,b]); return r;
}
function runLabel([a,b]){
  const s1=sOf[a], s2=sOf[b];
  if(s1===s2){ return (aNo[a]===1 && aNo[b]===S[s1][1]) ? `سورة ${NAMES[s1-1]}` : `${NAMES[s1-1]} ${f(aNo[a])}${a!==b?'–'+f(aNo[b]):''}`; }
  return `${NAMES[s1-1]} ${f(aNo[a])} – ${NAMES[s2-1]} ${f(aNo[b])}`;
}
function describe(rs){
  let pages=0, pmin=999, pmax=0;
  for(const [a,b] of rs){ for(let id=a;id<=b;id++) pages+=pw(id); pmin=Math.min(pmin,pOf[a],pOf[b]); pmax=Math.max(pmax,pOf[a],pOf[b]); }
  const label = rs.length>4 ? `${runLabel(rs[0])} … ${runLabel(rs[rs.length-1])}` : rs.map(runLabel).join('، ');
  const [a,b]=rs[0];
  const link = sOf[a]===sOf[b] ? `https://quran.com/${sOf[a]}/${aNo[a]}-${aNo[b]}` : `https://quran.com/${sOf[a]}/${aNo[a]}`;
  return {rs, label, pages, pr: pmin===pmax?`ص ${f(pmin)}`:`ص ${f(pmin)}–${f(pmax)}`, link};
}

/* ---------- plan model ---------- */
const KIND = {h:'حفظ جديد', n:'مراجعة قريبة', f:'مراجعة بعيدة', r:'مراجعة', t:'تلاوة'};
const TYPE_NAME = {hifz:'حفظ', review:'مراجعة', both:'حفظ ومراجعة', tilawa:'تلاوة'};
const isCycle = p => p.type==='review' || p.type==='tilawa';
const cache = new Map();
function compute(plan){
  const ck = JSON.stringify([plan.type,plan.hifz,plan.review,plan.base,plan.near,plan.far,plan.cycles]);
  let c = cache.get(plan.id); if(c && c.ck===ck) return c;
  const sessions=[];
  if(isCycle(plan)){
    const kind = plan.type==='tilawa'?'t':'r';
    const seq=buildSeq(plan.review.range), ch=chunk(seq,plan.review.amt,plan.review.unit), m=ch.length;
    for(let k=0;k<m*plan.cycles;k++){ const [i0,i1]=ch[k%m]; sessions.push({tasks:[{key:k+'r',kind,cycle:Math.floor(k/m)+1,...describe(runs(seq,i0,i1))}]}); }
    c={ck,sessions,seq,perCycle:m};
  } else {
    const seq=buildSeq(plan.hifz.range), ch=chunk(seq,plan.hifz.amt,plan.hifz.unit);
    const base = plan.type==='both' ? orient(buildSeq(plan.base), plan.hifz.range.dir) : [];
    const pool = base.concat(seq), P=[0]; for(const id of pool) P.push(P[P.length-1]+pw(id));
    const near = plan.type==='both' ? (plan.near||0) : 0, far = plan.type==='both' ? (plan.far||0) : 0;
    ch.forEach(([i0,i1],k)=>{
      const tasks=[{key:k+'h',kind:'h',i0,i1,...describe(runs(seq,i0,i1))}];
      // near review: either the last `near` sessions, or (nearPages) the last N pages memorised before today's portion, reaching into earlier memorisation
      let nearStart = base.length + (k-near>0 ? ch[k-near][0] : 0);
      if(plan.nearPages>0){
        const end = base.length + i0; let st=end;
        while(st>0 && P[end]-P[st-1] <= plan.nearPages+1e-6) st--;
        if(st<end){ tasks.push({key:k+'n',kind:'n',...describe(runs(pool,st,end-1))}); }
        nearStart = st;
      } else if(near>0 && k>0){ const s0=ch[Math.max(0,k-near)][0], s1=ch[k-1][1]; tasks.push({key:k+'n',kind:'n',...describe(runs(seq,s0,s1))}); }
      if(far>0){
        const L = nearStart, Wt=P[L];
        if(Wt>0.2){
          let slices;
          if(far>=Wt-1e-6) slices=[[0,L-1]];
          else{
            const o=(k*far)%Wt; let s=0; while(s<L && P[s+1]<=o+1e-9) s++;
            let acc=0, e=s, n=0; while(n<L){ acc+=pw(pool[e]); n++; if(acc>=far-1e-6) break; e=(e+1)%L; }
            slices = e>=s ? [[s,e]] : [[s,L-1],[0,e]];
          }
          const rs=[]; for(const [x,y] of slices) rs.push(...runs(pool,x,y));
          tasks.push({key:k+'f',kind:'f',...describe(rs)});
        }
      }
      sessions.push({tasks});
    });
    c={ck,sessions,seq,chunks:ch};
  }
  c.base = c.dates = datesFor(plan, sessions.length);
  c.dk = plan.start+'|'+plan.days.join()+'|'+JSON.stringify(plan.anchor||null); c.rk='null';
  cache.set(plan.id,c); return c;
}
function datesFor(plan,n,roll){
  const out=[], days=new Set(plan.days.length?plan.days:[0,1,2,3,4,5,6]);
  let d=parse(plan.start), k=0;
  const anchor=plan.anchor;
  while(k<n){
    if(anchor && k===anchor.k){ d=parse(anchor.date); }
    if(roll && k===roll.k){ d=parse(roll.date); }
    while(!days.has(d.getDay())) d.setDate(d.getDate()+1);
    out.push(iso(d)); d.setDate(d.getDate()+1); k++;
  }
  return out;
}
/* new memorisation never runs ahead: an unfinished portion stays as the day's wird, and the rest of the plan moves back with it */
const rolls = p => p.type==='hifz' || p.type==='both';
function rollAnchor(plan,base){
  const n=base.length, t=todayIso(); let k=0, doneToday=false;
  for(let j=0;j<n;j++){ const v=plan.done[j+'h']; if(v && iso(new Date(+v))===t) doneToday=true; }
  while(k<n && plan.done[k+'h']) k++;
  if(k>=n) return null;
  const days=new Set(plan.days.length?plan.days:[0,1,2,3,4,5,6]), d=parse(t);
  if(doneToday) d.setDate(d.getDate()+1);
  while(!days.has(d.getDay())) d.setDate(d.getDate()+1);
  const date=iso(d); return date>base[k] ? {k,date} : null;
}
function datesOf(plan){
  const c=compute(plan), dk=plan.start+'|'+plan.days.join()+'|'+JSON.stringify(plan.anchor||null);
  if(c.dk!==dk){ c.base=c.dates=datesFor(plan,c.sessions.length); c.dk=dk; c.rk='null'; }
  if(!rolls(plan)) return c.base;
  const ra=rollAnchor(plan,c.base), rk=JSON.stringify(ra);
  if(c.rk!==rk){ c.dates = ra ? datesFor(plan,c.sessions.length,ra) : c.base; c.rk=rk; }
  return c.dates;
}
/* steps: new memorisation counts in half pages, review and recitation in pages */
const stepsOf = tk => Math.max(1, Math.round(tk.pages*(tk.kind==='h'?2:1)));
const gotOf = (plan,tk) => plan.done[tk.key] ? stepsOf(tk) : Math.min(stepsOf(tk), (plan.prog||{})[tk.key]||0);
function setGot(plan,tk,n){
  const m=stepsOf(tk); n=Math.max(0,Math.min(m,n)); plan.prog=plan.prog||{};
  if(n>=m){ if(!plan.done[tk.key]) plan.done[tk.key]=Date.now(); delete plan.prog[tk.key]; }
  else { delete plan.done[tk.key]; if(n>0) plan.prog[tk.key]=n; else delete plan.prog[tk.key]; }
}
function stats(plan){
  const c=compute(plan), dates=datesOf(plan), t=todayIso();
  let total=0, done=0, sDone=0, firstOpen=-1, overdue=0;
  const roll=rolls(plan);
  c.sessions.forEach((s,k)=>{ let all=true; for(const tk of s.tasks){ total++; if(plan.done[tk.key]) done++; else all=false; }
    if(all) sDone++; else { if(firstOpen<0) firstOpen=k; if(dates[k]<t && !roll) overdue++; } });
  return {total,done,sDone,n:c.sessions.length,firstOpen,overdue,end:dates[dates.length-1]};
}

/* ---------- storage: private per-person store in claude.ai, browser storage as fallback ---------- */
const LS='rafiq-plans-v1';
const state={plans:{}, mode:'local', col:null, q:{}};
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS,JSON.stringify(state.plans)); }catch(e){} }
async function initStore(){
  state.plans = lsLoad();
  if(cloudOn()){ if(auth.s){ try{ await afterSignIn(); }catch(e){ console.warn('cloud',e); } } render(); return; }
  try{
    if(window.claude && window.claude.use){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if(db && uid){
        state.col = db.collection(`data/users/${uid}/app/plans`);
        const snap = await state.col.get();
        const remote={}; snap.docs.forEach(d=>{ const v=d.data(); if(v && v.id) remote[v.id]=v; });
        // carry plans made before sign-in into the account
        for(const id of Object.keys(state.plans)) if(!remote[id]){ remote[id]=state.plans[id]; save(id,remote[id]); }
        state.plans=remote; state.mode='cloud'; lsSave();
      }
    }
  }catch(e){ console.warn('store',e); }
    render();
}
function save(id, data){
  lsSave(); cloudSave(id,data);
  if(!state.col) return;
  const doc=state.col.doc(id);
  state.q[id]=(state.q[id]||Promise.resolve()).then(()=> data===null ? doc.delete() : doc.set(JSON.parse(JSON.stringify(data)))).catch(e=>{ console.warn(e); toast('تعذّر الحفظ في الحساب، بقيت نسخة على هذا الجهاز'); });
}
function put(plan){ state.plans[plan.id]=plan; save(plan.id,plan); }
function del(id){ delete state.plans[id]; cache.delete(id); save(id,null); }

async function idp(path,body){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/${path}?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const code=(j.error&&j.error.message||'').split(' ')[0]; const e=new Error(AUTH_ERR[code]||'تعذّر الاتصال، تأكد من الإنترنت وحاول مرة ثانية.'); e.code=code; throw e; }
  return j;
}
function takeSession(j){ auth.s={uid:j.localId||j.user_id, email:j.email||auth.s?.email, id:j.idToken||j.id_token, rt:j.refreshToken||j.refresh_token, exp:Date.now()+((+(j.expiresIn||j.expires_in)||3600)-120)*1000}; authSave(); }
async function token(){
  if(!auth.s) throw new Error('no session');
  if(Date.now()<auth.s.exp) return auth.s.id;
  const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.s.rt)});
  if(!r.ok){ if(r.status===400){ signOut(); } throw new Error('refresh'); }
  takeSession(await r.json()); return auth.s.id;
}
async function rtdb(path,method='GET',data){
  const r=await fetch(`${FB.db}/${path}.json?auth=${await token()}`,{method, headers:{'Content-Type':'application/json'}, body: data===undefined?undefined:JSON.stringify(data)});
  if(!r.ok) throw new Error('db '+r.status);
  try{ return await r.json(); }catch(e){ throw new Error('تعذّر الاتصال، تأكد من الإنترنت وحاول مرة ثانية.'); }
}
/* Firebase drops empty objects and arrays, so put back what a plan needs */
function normPlan(p){ p.done=p.done||{}; p.days=p.days||[]; if(p.prog===undefined) delete p.prog; return p; }

async function signUp({first,last,phone,email,password}){
  takeSession(await idp('accounts:signUp',{email,password,returnSecureToken:true}));
  auth.profile={first,last,phone,email,created:Date.now()};
  await rtdb(`users/${auth.s.uid}/profile`,'PUT',auth.profile);
  await afterSignIn();
}
async function signIn(email,password){
  takeSession(await idp('accounts:signInWithPassword',{email,password,returnSecureToken:true}));
  await afterSignIn();
}
const resetPassword = email => idp('accounts:sendOobCode',{requestType:'PASSWORD_RESET',email});
function signOut(){ auth.s=null; auth.profile=null; authSave(); state.plans={}; cache.clear?.(); lsSave(); state.mode='local'; render(); }

/* load the account's plans; plans made on this device before signing in move into the account */
async function afterSignIn(){
  const [prof,remote]=await Promise.all([rtdb(`users/${auth.s.uid}/profile`), rtdb(`users/${auth.s.uid}/plans`)]);
  auth.profile=prof||auth.profile;
  const plans={}; for(const [id,p] of Object.entries(remote||{})) plans[id]=normPlan(p);
  for(const [id,p] of Object.entries(state.plans)) if(!plans[id]){ plans[id]=p; rtdb(`users/${auth.s.uid}/plans/${id}`,'PUT',p).catch(()=>{}); }
  state.plans=plans; state.mode='cloud'; lsSave();
  for(const p of Object.values(plans)) if(!p.code){ p.code=newCode(); cloudSave(p.id,p); }
  pushAllGroups();
}
async function cloudInit(){
  if(!cloudOn() || !auth.s) return;
  try{ await afterSignIn(); }catch(e){ console.warn('cloud',e); }
}
const cq={};
function cloudSave(id,data){
  if(!cloudOn() || !auth.s) return;
  cq[id]=(cq[id]||Promise.resolve()).then(()=>rtdb(`users/${auth.s.uid}/plans/${id}`, data===null?'DELETE':'PUT', data===null?undefined:JSON.parse(JSON.stringify(data))))
    .catch(e=>{ console.warn(e); toast('تعذّر الحفظ في حسابك، بقيت نسخة على هذا الجهاز'); });
  if(data && data.group) pushGroup(data);
}

/* ---------- friends: every plan has a code; whoever enters it shares progress with you ---------- */
const rid=(n,abc)=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>abc[x%abc.length]).join('');
const newCode=()=>rid(6,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
const myName = () => auth.profile ? `${auth.profile.first||''} ${auth.profile.last||''}`.trim() : '';
function summary(plan){
  const sg=stages(plan), cs=sg.list[sg.cur]||{no:1,pct:0}, c=compute(plan), ds=datesOf(plan), t=todayIso();
  let total=0, done=0, pages=0;
  ds.forEach((d,k)=>{ if(d===t) for(const tk of c.sessions[k].tasks){ total++; if(plan.done[tk.key]) done++; } });
  for(const s of c.sessions) for(const tk of s.tasks) if(tk.kind==='h' && plan.done[tk.key]) pages+=tk.pages;
  return {name:myName()||'صديق', plan:plan.name, type:plan.type, stage:cs.no, pct:cs.pct, done, total, pages:Math.round(pages*10)/10, streak:streakInfo().n, day:t, at:Date.now()};
}
const gTimers={};
function pushGroup(plan){
  if(!cloudOn() || !auth.s || !plan.group) return;
  clearTimeout(gTimers[plan.id]);
  gTimers[plan.id]=setTimeout(()=>rtdb(`groups/${plan.group}/members/${auth.s.uid}`,'PUT',summary(plan)).catch(e=>console.warn('group',e)),800);
}
function pushAllGroups(){ for(const p of Object.values(state.plans)) if(p.group) pushGroup(p); }
async function groupMembers(code){ const m=await rtdb(`groups/${code}/members`); return m||{}; }
async function leaveGroup(plan){
  const code=plan.group; plan.group=null; put(plan);
  await rtdb(`groups/${code}/members/${auth.s.uid}`,'DELETE').catch(()=>{});
}

const planDir = p => (isCycle(p)?p.review:p.hifz).range.dir==='rev' ? 'rev' : 'fwd';

  const add=id=>{ const j=jOf[id]; if(!(j in wt)){ wt[j]=0; got[j]=0; } wt[j]+=pw(id); };
  const base = !isCycle(plan) && plan.base && plan.base.type!=='none' ? buildSeq(plan.base) : [];
  for(const id of base){ add(id); got[jOf[id]]+=pw(id); }

function printDoc(plan,scope){

  const ks=[]; for(let k=(scope==='all'?0:cyc0);k<(scope==='all'?c.sessions.length:cyc1);k++) if(scope==='all' || sg.list.length<2 || sessionStage(plan,k,sg)===sg.cur) ks.push(k);

/* a real PDF file saved to the device (the print dialog does not open inside installed apps on many phones) */
const loadJs=src=>new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
let pdfBusy=false;
async function savePdf(plan,scope){
  if(pdfBusy) return; pdfBusy=true; toast('جارٍ تجهيز ملف PDF…');
  const box=document.createElement('div'); box.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;padding:40px 38px;box-sizing:border-box';
  box.innerHTML=printDoc(plan,scope); document.body.appendChild(box);
  try{
    if(!window.html2canvas) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await (document.fonts&&document.fonts.ready);
    const sc=1.6, cv=await html2canvas(box,{scale:sc,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const pageH=Math.round(794*297/210), top0=box.getBoundingClientRect().top;
    const cuts=[...box.querySelectorAll('.pd-tb tr,section,header,footer')].map(r=>r.getBoundingClientRect().bottom-top0).sort((a,b)=>a-b);
    const pages=[]; let y=0; const H=box.offsetHeight;
    while(y<H-2){ const lim=pages.length?pageH-56:pageH; let e=Math.min(H,y+lim); if(e<H){ const c=cuts.filter(v=>v>y+lim*.5&&v<=e).pop(); if(c) e=c; } pages.push([y,e]); y=e; }
    const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'px',format:[794,pageH],hotfixes:['px_scaling']});
    pages.forEach(([a,b],i)=>{ const c=document.createElement('canvas'); c.width=cv.width; c.height=Math.round((b-a)*sc);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(cv,0,Math.round(a*sc),cv.width,c.height,0,0,cv.width,c.height);
      if(i) doc.addPage([794,pageH]); doc.addImage(c.toDataURL('image/jpeg',.86),'JPEG',0,i?28:0,794,b-a); });
    const blob=doc.output('blob'), name=`ربيع القرآن - ${plan.name}.pdf`.replace(/[\\/:*?"<>|]/g,'');
    const file=new File([blob],name,{type:'application/pdf'}), ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
    if(ios && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}).catch(()=>{}); }
    else { const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); toast('تم حفظ الملف في التنزيلات'); }
  }catch(e){ toast('ما قدرنا نجهّز الملف، تأكد من الاتصال وجرب مرة ثانية'); }
  finally{ box.remove(); pdfBusy=false; }
}

/* ---------- new plan: three questions ---------- */
function rangeName(r){
  if(r.type==='span'){ const pt=(s,a,last)=> `${NAMES[s-1]}${(last? a<S[s][1] : a>1)?' '+f(a):''}`;
    if(r.s1===r.s2) return (Math.min(r.a1,r.a2)===1 && Math.max(r.a1,r.a2)===S[r.s1][1]) ? `سورة ${NAMES[r.s1-1]}` : `${NAMES[r.s1-1]} ${f(Math.min(r.a1,r.a2))}–${f(Math.max(r.a1,r.a2))}`;
    return `${pt(r.s1,r.a1,false)} – ${pt(r.s2,r.a2,true)}`; }
  if(r.type==='all') return 'القرآن كاملاً';
  if(r.type==='juz') return r.from===r.to?`الجزء ${f(r.from)}`:`الأجزاء ${f(Math.min(r.from,r.to))}–${f(Math.max(r.from,r.to))}`;
  const a=Math.min(r.from,r.to), b=Math.max(r.from,r.to); return a===b?`سورة ${NAMES[a-1]}`: r.dir==='rev'?`${NAMES[b-1]} – ${NAMES[a-1]}`:`${NAMES[a-1]} – ${NAMES[b-1]}`;
}
function opt(name,val,text,checked,sub){ return `<label class="opt"><input type="radio" name="${name}" value="${val}" ${checked?'checked':''}><span>${text}${sub?`<small>${sub}</small>`:''}</span></label>`; }
function setRadio(form,name,val){ const el=form.querySelector(`input[name="${name}"][value="${val}"]`); if(el) el.checked=true; }
function carryOver(old,np){
  const oc=compute(old), nc=compute(np);
  if(isCycle(old) && isCycle(np)){ let n=0; for(let k=0;k<oc.sessions.length;k++) if(old.done[k+'r']) n++;
    for(let k=0;k<Math.min(n,nc.sessions.length);k++) np.done[k+'r']=old.done[k+'r']||Date.now(); return; }
  if(isCycle(old) || isCycle(np)) return;
  const mem=new Set(); oc.chunks.forEach(([i0,i1],k)=>{ if(old.done[k+'h']) for(let i=i0;i<=i1;i++) mem.add(oc.seq[i]); });
  nc.chunks.forEach(([i0,i1],k)=>{ let all=true; for(let i=i0;i<=i1&&all;i++) if(!mem.has(nc.seq[i])) all=false;
    if(all) for(const tk of nc.sessions[k].tasks) np.done[tk.key]=Date.now(); });
}

}

function planFromForm(form){

  const m=readPt(form,'m-'), b=readPt(form,'b-'), e=readPt(form,'e-');

    if(!st) { err='ما شاء الله، محفوظك يصل إلى آخر المصحف. اختر «مراجعة» بدلاً من الحفظ.'; range=spanOf(dir,first,last); }
    else range=spanOf(dir,st,last);

    if(!m){ err='اختر إلى أين وصل حفظك.'; range=spanOf(dir,first,first); } else range=spanOf(dir,first,m);

  const plan={id:'p'+Date.now().toString(36), created:Date.now(), type, status:'active', days:days.length?days:[0,1,2,3,4,5,6], start:form.querySelector('#start').value||todayIso(), done:{}};

  plan.err=err; return plan;

function harvest(){
  const mem=new Set(), rev=new Set(), til=new Set(), perDay={}, kinds={h:0,r:0,t:0};
  const today=new Date(); const day0=new Date(today); day0.setDate(today.getDate()-6);
  for(const p of Object.values(state.plans)){ const c=compute(p);
    c.sessions.forEach(s=>s.tasks.forEach(tk=>{ const ts=p.done[tk.key]; if(!ts) return;
      const set = tk.kind==='h'?mem: tk.kind==='t'?til: rev; let n=0;
      for(const [a,b] of tk.rs) for(let id=a;id<=b;id++){ set.add(id); n++; }
      const k = tk.kind==='h'?'h':tk.kind==='t'?'t':'r', di=iso(new Date(+ts));
      (perDay[di]=perDay[di]||{h:0,r:0,t:0})[k]+=n; kinds[k]+=n; })); }
  return {mem,rev,til,perDay,kinds};
}

function weekChart(perDay){
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(iso(d)); }
  const vals=days.map(d=>perDay[d]||{h:0,r:0,t:0}), max=Math.max(10,...vals.map(v=>v.h+v.r+v.t));

let QT=null, qtP=null;
const QURAN_CDN='https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/quran.json';
function loadQuran(){
  if(QT) return Promise.resolve(QT); if(qtP) return qtP;
  qtP=(async()=>{
    try{ const r=await fetch('quran.json'); if(r.ok){ const d=await r.json(); if(Array.isArray(d)&&d.length===NA){ QT=d; return QT; } } }catch(e){}
    const r=await fetch(QURAN_CDN); if(!r.ok) throw new Error('net'); const d=await r.json();
    QT=d.flatMap(s=>s.verses.map(v=>v.text));
    try{ const c=await caches.open('rafiq-quran'); await c.put(new URL('quran.json',location.href).href, new Response(JSON.stringify(QT),{headers:{'Content-Type':'application/json'}})); }catch(e){}
    return QT;
  })();
  qtP.catch(()=>{ qtP=null; });
  return qtP;
}
/* ---------- printed-page layout: the 15-line Madani muṣḥaf, line for line ----------
   Text and line breaks: KFGQPC Uthmanic Hafs v3 via the quran-text dataset (quran.ws, CC BY 4.0),
   drawn with the King Fahd Complex font. Loaded once, then cached for offline use. */
let MS=null, msP=null;
const MS_CDN='https://cdn.jsdelivr.net/npm/@quran.ws/text@0.1.0/data/';
async function cachedFetch(name,cdn,onBytes){
  const key=new URL(name,location.href).href; let c=null;
  try{ c=await caches.open('rafiq-quran'); const hit=await c.match(key); if(hit) return hit; }catch(e){}
  let r=null; try{ r=await fetch(name); if(!r.ok) r=null; }catch(e){}
  if(!r){ r=await fetch(cdn); if(!r.ok) throw new Error('net'); }
  if(onBytes && r.body){ const rd=r.body.getReader(), parts=[]; for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); onBytes(value.length); }
    r=new Response(new Blob(parts),{headers:{'Content-Type':r.headers.get('Content-Type')||'application/octet-stream'}}); }
  try{ c&&await c.put(key,r.clone()); }catch(e){}
  return r;
}

function loadMushaf(tick){
  if(MS) return Promise.resolve(MS); if(msP) return msP;
  msP=(async()=>{
    const d=await (await cachedFetch('hafs.json',MS_CDN+'hafs.json',tick)).json();
    try{ const fb=await (await cachedFetch('UthmanicHafs.ttf',MS_CDN+'UthmanicHafs-v-3.0.ttf',tick)).arrayBuffer();
      const ff=new FontFace('KFGQPC Hafs',fb); await ff.load(); document.fonts.add(ff); }catch(e){}
    const mk=new Map(); d.marks.forEach(([w,t])=>{ if(!mk.has(w)) mk.set(w,[]); mk.get(w).push(d.mark_types[t]); });
    MS={w:d.words, ls:d.line_starts, ps:d.page_starts, as:d.ayah_starts, ss:d.surah_starts, mk};
    return MS;
  })();
  msP.catch(()=>{ msP=null; });
  return msP;
}
const bsearch=(arr,x)=>{ let lo=0,hi=arr.length; while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<=x) lo=m+1; else hi=m; } return lo; }; // count of items <= x

function msWord(i){ let t=esc(MS.w[i]); for(const m of MS.mk.get(i)||[]) t = m.side==='before' ? `${m.sign} ${t}` : t+m.sign; return t; }
function msPage(p,cur){
  const M=MS, a=M.ps[p-1], b=p<604?M.ps[p]:M.w.length; let h='';
  for(let li=bsearch(M.ls,a-1); li<M.ls.length && M.ls[li]<b; li++){
    const s=M.ls[li], e=li+1<M.ls.length?Math.min(M.ls[li+1],b):b, sk=M.ss.indexOf(s);
    if(sk>=0){ h+=`<div class="ml msh"><span>سورة ${NAMES[sk]}</span></div>`; if(sk!==0&&sk!==8) h+=`<div class="ml mbs"><span>${[0,1,2,3].map(msWord).join(' ')}</span></div>`; }
    let k=bsearch(M.as,s), line='';
    for(let i=s;i<e;i++){
      while(k<M.as.length && M.as[k]<=i) k++;
      line+=`<span class="ay" data-act="ayTap" data-id="${k}">${msWord(i)}</span>`;
      const end = k<M.as.length ? M.as[k]===i+1 : i===M.w.length-1;

    }
    h+=`<div class="ml">${line}</div>`;

  return `<div class="mp15 ${p<=2?'mp-open':''}"${cur?' id="mpage"':''}>${h}</div>`;
}

/* ---------- recitation check (speech recognition) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const AR_MARKS=/[ؐ-ًؚ-ٟۖ-ۭـ]/g;
function qnorm(w){
  return w.replace(/وٰ/g,'ا').replace(/ٰ/g,'').replace(AR_MARKS,'').replace(/[ٱأإآ]/g,'ا').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^ء-ي]/g,'');
}
const MUQ={'ا':'الف','ل':'لام','م':'ميم','ص':'صاد','ر':'را','ك':'كاف','ه':'ها','ي':'يا','ع':'عين','ط':'طا','س':'سين','ح':'حا','ق':'قاف','ن':'نون'};
const MUQ_SET=new Set(['الم','المص','الر','المر','كهيعص','طه','طسم','طس','يس','ص','حم','عسق','ق','ن']);
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const sim=(a,b)=>{ if(a===b) return 1; const L=Math.max(a.length,b.length); return L?1-lev(a,b)/L:0; };
function wordSim(e,r){ let s=Math.max(sim(e.n,r), e.alt?sim(e.alt,r):0);
  if(e.n.length>3 && r.startsWith('و')!==e.n.startsWith('و')) s=Math.max(s, sim(e.n.replace(/^و/,''), r.replace(/^و/,''))-0.15);
  return s; }
const OK_AT=e=>e.n.length<=3?0.66:0.72;
function buildWords(rs){
  const W=[]; for(const [a,b] of rs) for(let id=a;id<=b;id++){
    const ws=QT[id-1].split(/\s+/).filter(w=>qnorm(w)); ws.forEach((w,k)=>{ const n=qnorm(w); const e={t:w,n,id,last:k===ws.length-1,st:'p',hint:W.length===0};
      if(k===0 && aNo[id]===1 && MUQ_SET.has(n)) e.alt=[...n].map(c=>MUQ[c]||c).join('');

/* align what was heard with the expected words, left to right */
function alignRec(W,text,final){
  const R=text.split(/\s+/).map(qnorm).filter(Boolean);
  W.forEach(w=>{ w.st='p'; w.heard=null; });
  let i=0;
  for(let j=0;j<R.length && i<W.length;j++){
    const cands=[[R[j],1]]; if(j+1<R.length) cands.push([R[j]+R[j+1],2]); if(j+2<R.length) cands.push([R[j]+R[j+1]+R[j+2],3]);
    let best=null;
    for(let k=i;k<Math.min(W.length,i+6);k++){
      for(const [r,used] of cands){
        let s=wordSim(W[k],r), span=1;
        if(k+1<W.length){ const s2=wordSim({n:W[k].n+W[k+1].n},r); if(s2>s+0.05){ s=s2; span=2; } }
        const need = k===i ? OK_AT(W[k]) : Math.max(0.86, OK_AT(W[k]));
        if(s>=need && (k===i || W[k].n.length>=3) && (!best || k<best.k || (k===best.k && s>best.s))){ best={k,s,used,span}; }
      }
      if(best && best.k===k) break;
    }
    if(best){ for(let x=i;x<best.k;x++) W[x].st='m';
      for(let x=best.k;x<best.k+best.span;x++) W[x].st='ok';
      i=best.k+best.span; j+=best.used-1; }
    else if(sim(W[i].n,R[j])>=0.34 || (R.length-j)<=1){ W[i].heard=R[j]; W[i].st=(!final && j===R.length-1)?'c':'e'; if(W[i].st!=='c') i++; }

const audUrl=(r,id)=>`https://everyayah.com/data/${r}/${pad3(sOf[id])}${pad3(aNo[id])}.mp3`;

const PL={q:[],k:0,n:0,l:0,on:false,load:false};
const plIds=rs=>rs.flatMap(([a,b])=>Array.from({length:b-a+1},(_,i)=>a+i));
function plStart(ids){ plStop(); Object.assign(PL,{q:ids,k:0,n:0,l:0,on:true}); plPlay(); }
function plPlay(){
  const o=audOpts(), id=PL.q[PL.k]; if(!id) return plStop();
  if(!AUD){ AUD=new Audio(); AUD.onended=plEnded;
    AUD.onerror=()=>{ if(!PL.on) return; PL.on=false; PL.load=false; toast(navigator.onLine?'تعذّر تشغيل الصوت، حاول مرة ثانية':'الاستماع يحتاج اتصال إنترنت'); plBar(); };
    AUD.onplaying=()=>{ PL.load=false; plBar(); }; AUD.onwaiting=()=>{ PL.load=true; plBar(); }; }

  AUD.playbackRate=o.sp; AUD.preservesPitch=true; PL.load=true;

  const nx=PL.q[PL.k+1]; if(nx){ audNext=audNext||new Audio(); audNext.preload='auto'; audNext.src=audUrl(o.r,nx); }

function plEnded(){

}
function plStop(){ PL.on=false; PL.q=[]; clearTimeout(audT); if(AUD){ AUD.pause(); } plBar(); plMark(); }

function plSkip(d){ if(!PL.q.length) return; PL.k=Math.max(0,Math.min(PL.q.length-1,PL.k+d)); PL.n=0; PL.on=true; clearTimeout(audT); plPlay(); }

/* ---------- quiz: complete the ayah, what comes next, which surah ---------- */
const shuf=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const qzWords=id=>QT[id-1].split(/\s+/).filter(w=>qnorm(w));
const qzCut=(ws,a,n)=>ws.slice(a,a+n).join(' ')+(ws.length>a+n?' …':'');
const qzEnd=id=>{ const ws=qzWords(id), c=Math.min(Math.ceil(ws.length/2),8); return qzCut(ws,c,8); };
const qzStart=id=>qzCut(qzWords(id),0,6);
const qzShow=id=>{ const ws=qzWords(id); return ws.length>22?'… '+ws.slice(-16).join(' '):QT[id-1]; };
const qzRoute=rs=>{ const ids=[...new Set(plIds(rs))].sort((a,b)=>a-b), out=[]; for(const id of ids){ const l=out[out.length-1]; if(l&&l[1]===id-1) l[1]=id; else out.push([id,id]); } return 'quiz-'+out.map(x=>x.join('-')).join('_'); };
function qzPick(ok,pool,fn){ const seen=new Set([qnorm(ok)]), out=[];
  for(const x of shuf(pool)){ const t=fn(x), n=qnorm(t); if(!n||seen.has(n)) continue; seen.add(n); out.push(t); if(out.length===2) break; }
  return out.length===2?shuf([ok,...out]):null; }
function qzMake(ids){
  const lo=Math.max(1,ids[0]-40), hi=Math.min(NA,ids[ids.length-1]+40);
  const near=Array.from({length:hi-lo+1},(_,i)=>lo+i), pool=ids.length>=8?ids:near;
  const long=x=>qzWords(x).length>=4;
  const mk={
    c:id=>{ if(!long(id)) return null; const ws=qzWords(id), c=Math.min(Math.ceil(ws.length/2),8), ok=qzEnd(id);
      const ch=qzPick(ok,pool.filter(x=>x!==id&&long(x)),qzEnd); return ch&&{t:'أكمل الآية',p:ws.slice(0,c).join(' ')+' …',ch,ok,id}; },
    n:id=>{ if(id>=NA||sOf[id+1]!==sOf[id]) return null; const ok=qzStart(id+1);
      const ch=qzPick(ok,pool.filter(x=>x!==id+1&&x!==id),qzStart); return ch&&{t:'ما الآية التي بعدها؟',p:qzShow(id),ch,ok,id:id+1}; },
    s:id=>{ const s=sOf[id], ss=[...new Set(near.map(x=>sOf[x]))].filter(x=>x!==s), more=[s-2,s-1,s+1,s+2].filter(x=>x>=1&&x<=114&&x!==s);
      const ch=qzPick(NAMES[s-1],ss.length>=2?ss:[...new Set([...ss,...more])],x=>NAMES[x-1]); return ch&&{t:'من أي سورة هذه الآية؟',p:qzShow(id),ch,ok:NAMES[s-1],id}; }
  };
  const order=shuf(ids), qs=[], used=new Set(), T=['c','n','s'];
  for(let r=0;r<3&&qs.length<10;r++) order.forEach((id,i)=>{ if(qs.length>=10) return; const k=T[(i+r)%3]; if(used.has(id+k)) return; const q=mk[k](id); if(q){ used.add(id+k); qs.push(q); } });
  return shuf(qs);
}
const qzStat=()=>{ try{ return JSON.parse(localStorage.getItem('rafiq-qz')||'{}'); }catch(e){ return {}; } };
function vQuiz(r){
  const rs=r.slice(5).split('_').map(x=>x.split('-').map(Number)).filter(x=>x.length===2&&x[0]>=1&&x[1]<=NA&&x[0]<=x[1]);
  const label=rs.map(runLabel).join('، ');
  if(!rs.length) return topbar('اختبر حفظك',{back:'#today'})+'<p class="muted">ما لقينا الآيات.</p>';
  if(!QT){ loadQuran().then(()=>{ if(route()===r) rerender(); }).catch(()=>{ const el=document.getElementById('mload'); if(el) el.textContent='تحتاج اتصال إنترنت أول مرة لتحميل المصحف.'; });
    return topbar('اختبر حفظك',{back:'#today',sub:label})+'<div class="mload" id="mload">جارٍ تحميل الآيات…</div>'; }
  if(!ui.qz||ui.qz.key!==r){ ui.qz={key:r,qs:qzMake(plIds(rs)),i:0,score:0,pick:null}; }
  const z=ui.qz, n=z.qs.length;
  if(!n) return topbar('اختبر حفظك',{back:'#today',sub:label})+'<div class="card muted">الآيات قليلة جدًا للاختبار. جرّب مع ورد أطول.</div>';
  if(z.i>=n){
    const pct=Math.round(z.score/n*100);
    if(!z.saved){ z.saved=1; try{ const s=qzStat(); s.a=(s.a||0)+1; if(pct===100) s.p=(s.p||0)+1; s.best=Math.max(s.best||0,pct); localStorage.setItem('rafiq-qz',JSON.stringify(s)); }catch(e){} }
    const head=pct===100?'ما شاء الله، كلها صح!':pct>=80?'أحسنت، حفظك ثابت':pct>=50?'بداية طيبة، راجعها وتتقن':'لا تشيل هم، المراجعة تثبّته بإذن الله';
    return topbar('اختبر حفظك',{back:'#today',sub:label})+`<div class="stack"><div class="card rcs"><b>${head}</b><div class="rcpct">${f(z.score)} من ${f(n)}</div>
      <button class="btn block" data-act="qzAgain">اختبار جديد</button>
      <button class="btn ghost block rcgo" data-act="plAyah" data-a="${rs[0][0]}" data-b="${rs[rs.length-1][1]}">${IC.play} استمع للآيات</button></div></div>`;
  }
  const q=z.qs[z.i], picked=z.pick!==null;
  const opts=q.ch.map((c,k)=>{ const cls=!picked?'':c===q.ok?'ok':k===z.pick?'bad':'';
    return `<button class="qopt ${cls}" data-act="qzPick" data-k="${k}" ${picked?'disabled':''}>${esc(c)}</button>`; }).join('');
  return topbar('اختبر حفظك',{back:'#today',sub:label})+`<div class="stack">
    <div class="qzbar"><span class="small muted">سؤال ${f(z.i+1)} من ${f(n)}</span><div class="bar"><i style="width:${Math.round(z.i/n*100)}%"></i></div></div>
    <div class="card"><h3 class="qzt">${q.t}</h3><div class="verse qv">${esc(q.p)}</div></div>
    <div class="qopts">${opts}</div>
    ${picked?`<p class="small muted qzfb">${q.ch[z.pick]===q.ok?'صح، بارك الله فيك':`الجواب الصحيح باللون الأخضر (${NAMES[sOf[q.id]-1]}، آية ${f(aNo[q.id])})`}</p><button class="btn block" data-act="qzNext">${z.i+1<n?'السؤال التالي':'شوف النتيجة'}</button>`:''}
  </div>`;
}

/* ---------- short tafsir (al-Muyassar), cached per surah after first view ---------- */
const TAFSIR_URL=s=>`https://api.alquran.cloud/v1/surah/${s}/ar.muyassar`;
const TF={};
async function tafsirOf(id){
  const s=sOf[id];
  if(!TF[s]){ const u=TAFSIR_URL(s); let r=null, c=null;
    try{ c=await caches.open('rafiq-tafsir'); r=await c.match(u); }catch(e){}
    if(!r){ r=await fetch(u); if(!r.ok) throw new Error('net'); try{ c&&await c.put(u,r.clone()); }catch(e){} }
    const d=await r.json(); TF[s]=d.data.ayahs.map(a=>a.text); }
  return TF[s][aNo[id]-1]||'';
}
/* word meanings: «السراج في بيان غريب القرآن» as published by QuranEnc.com, shown unmodified */
const GHARIB_URL=s=>`https://quranenc.com/api/v1/translation/sura/arabic_seraj/${s}`;
const GH={};
async function gharibOf(id){
  const s=sOf[id];
  if(!GH[s]){ const u=GHARIB_URL(s); let r=null, c=null;
    try{ c=await caches.open('rafiq-tafsir'); r=await c.match(u); }catch(e){}
    if(!r){ r=await fetch(u); if(!r.ok) throw new Error('net'); try{ c&&await c.put(u,r.clone()); }catch(e){} }
    const d=await r.json(), m={}; (d.result||[]).forEach(x=>{ m[+x.aya]=x.translation||''; }); GH[s]=m; }
  return GH[s][aNo[id]]||'';
}
function showGharib(id){
  gharibOf(id).then(t=>{ const el=document.getElementById('ghr'); if(!el||+el.dataset.id!==id) return;
    if(!t.trim()){ el.parentNode.hidden=true; return; }
    el.innerHTML=t.split(/\n+/).filter(x=>x.trim()).map(x=>`<p>${esc(x)}</p>`).join(''); })
    .catch(()=>{ const el=document.getElementById('ghr'); if(el&&+el.dataset.id===id) el.parentNode.hidden=true; });
}
function showTafsir(id){
  showGharib(id);
  const el=document.getElementById('tfs'); if(!el) return;

/* ---------- badges: 100, front-loaded so the first days are rewarding ---------- */
const lsNum=k=>{ try{ return +localStorage.getItem(k)||0; }catch(e){ return 0; } };
const lsInc=(k,n=1)=>{ try{ localStorage.setItem(k,String(lsNum(k)+n)); }catch(e){} };
function notePage(p){ try{ const s=new Set(JSON.parse(localStorage.getItem('rafiq-pg')||'[]')); if(!s.has(p)){ s.add(p); localStorage.setItem('rafiq-pg',JSON.stringify([...s])); } }catch(e){} }
const rcBest=()=>{ try{ return JSON.parse(localStorage.getItem('rafiq-rc')||'{}'); }catch(e){ return {}; } };
function metrics(){
  const h=harvest(), ts=[]; let T=0, notes=0, plansDone=0, grp=0;
  for(const p of Object.values(state.plans)){
    for(const v of Object.values(p.done)) if(v){ ts.push(+v); T++; }
    for(const r of Object.values(p.rec||{})) if(r && r.n) notes++;
    if(status(p)==='complete') plansDone++; if(p.group) grp++; }
  const days=[...new Set(ts.map(v=>iso(new Date(v))))].sort();
  let BS=0, run=0, prev=null, back=0;
  for(const d of days){ const t=new Date(d+'T12:00'), gap=prev?(t-prev)/864e5:0; run = prev && gap<1.5 ? run+1 : 1; if(gap>=4) back=1; BS=Math.max(BS,run); prev=t; }
  const fajr=new Set(ts.filter(v=>{ const x=new Date(v).getHours(); return x>=3 && x<7; }).map(v=>iso(new Date(v)))).size;
  const fri=new Set(ts.filter(v=>new Date(v).getDay()===5).map(v=>iso(new Date(v)))).size;
  const M=Math.round([...h.mem].reduce((a,id)=>a+pw(id),0)*1000)/1000;
  const sFull=s=>{ const [a,n]=S[s]; for(let id=a;id<a+n;id++) if(!h.mem.has(id)) return false; return true; };
  let SC=0; for(let s=1;s<=114;s++) if(sFull(s)) SC++;
  const jm=new Float64Array(31), jt=new Float64Array(31); for(const id of h.mem) jm[jOf[id]]+=pw(id); for(let id=1;id<=NA;id++) jt[jOf[id]]+=pw(id);
  const jFull=j=>jm[j]/jt[j]>=0.98; let JC=0; for(let j=1;j<=30;j++) if(jFull(j)) JC++;
  let P=0; try{ P=JSON.parse(localStorage.getItem('rafiq-pg')||'[]').length; }catch(e){}
  const rc=rcBest();
  return {T,D:days.length,BS,back,fajr,fri,notes,plansDone,grp,M,SC,JC,RV:h.kinds.r,TL:h.kinds.t,
    mulk:+sFull(67),kahf:+sFull(18),yasin:+sFull(36),baqara:+sFull(2),amma:+jFull(30),tabarak:+jFull(29),

function toggleSession(plan,k){
  const s=compute(plan).sessions[k], all=sessDone(plan,s), now=Date.now();
  for(const tk of s.tasks){ if(all) setGot(plan,tk,0); else if(!plan.done[tk.key]) setGot(plan,tk,stepsOf(tk)); }
  if(!all && stats(plan).firstOpen<0 && status(plan)==='active'){ plan.status='complete'; toast('ما شاء الله، أتممت الخطة كاملة'); }
  put(plan);
}

function toggleTask(plan,k,i){
  const tk=compute(plan).sessions[k].tasks[i];
  setGot(plan,tk, plan.done[tk.key] ? 0 : stepsOf(tk));
  if(plan.done[tk.key] && stats(plan).firstOpen<0){ plan.status='complete'; toast('ما شاء الله، أتممت الخطة كاملة'); }
  put(plan);
}

  if(act==='shareWird'){ const ta=document.getElementById('wirdTxt');
    if(navigator.share) navigator.share({text:ta.value}).catch(err=>{ if(err?.name!=='AbortError') copyWird(); }); else copyWird(); return; }
  if(act==='pause'){ ui.menu=null; plan.status = status(plan)==='paused'?'active':'paused'; put(plan); closeSheet(); toast(plan.status==='paused'?'أُوقفت الخطة مؤقتاً':'استُؤنفت الخطة'); rerender(); return; }
  if(act==='askDel'){ document.getElementById('delc').innerHTML=`<div class="card" style="border-color:var(--warn)"><p style="margin:0 0 10px">ستُحذف «${esc(plan.name)}» وكل ما سجّلته فيها. متأكد؟</p><div class="row"><button class="btn danger" data-act="del" data-plan="${plan.id}">نعم، احذفها</button><button class="btn ghost" data-act="closeSheet">إلغاء</button></div></div>`; return; }
  if(act==='del'){ ui.menu=null; del(plan.id); closeSheet(); toast('حُذفت الخطة'); location.hash='#plans'; return; }
  if(act==='askResched'){ reschedSheet(plan.id); return; }
  if(act==='resched'){ const st=stats(plan); plan.anchor={k:st.firstOpen,date:todayIso()}; put(plan); closeSheet(); toast('رُتّبت الجلسات من اليوم'); rerender(); return; }
  if(act==='stageMenu'){ ui.stageMenu[plan.id]=!ui.stageMenu[plan.id]; rerender(); return; }
  if(act==='stage'){ ui.stage[plan.id]=+b.dataset.i; ui.menu=null; if(b.tagName!=='A') rerender(); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='remindAt'){ const plan=state.plans[t.dataset.plan]; if(plan && t.value){ plan.remindAt=t.value; put(plan); document.getElementById('gcal').href=gcalUrl(plan); } return; }
  if(t.id==='audR'){ const o=audOpts(); o.r=t.value; audSave(o); plBar(); if(route()==='today') rerender(); return; }
  if(t.id==='note' && ui.sess){ setRec({n:t.value.slice(0,500)}); return; }
  const form=t.closest('#newf'); if(form) syncForm(form,t);
});
document.addEventListener('input',e=>{ if(e.target.id==='mq'){ ui.mq=e.target.value; const pos=e.target.selectionStart; rerender(); const el=document.getElementById('mq'); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } return; }
  const form=e.target.closest('#newf'); if(form && e.target.type==='number') syncForm(form); });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(sheetRoot.innerHTML){ closeSheet(); rerender(); } else if(ui.menu){ ui.menu=null; rerender(); } });
document.addEventListener('submit',e=>{
  if(e.target.id==='authf'){ e.preventDefault(); submitAuth(e.target); return; }
  if(e.target.id==='joinf'){ e.preventDefault(); submitJoin(e.target); return; }
  if(e.target.id==='proff'){ e.preventDefault(); submitProfile(e.target); return; }
  if(e.target.id==='supf'){ e.preventDefault(); submitSupport(e.target); return; }
  if(e.target.id!=='newf') return;
  e.preventDefault(); const plan=planFromForm(e.target);
  if(plan.err){ toast(plan.err); return; } delete plan.err;
  if(!buildSeq(isCycle(plan)?plan.review.range:plan.hifz.range).length){ toast('اختر نطاقاً فيه آيات'); return; }
  const editId=e.target.dataset.edit;
  if(editId && state.plans[editId]){ const old=state.plans[editId];
    plan.id=old.id; plan.created=old.created; plan.status=old.status==='complete'?'active':old.status; plan.rec=old.rec; cache.delete(plan.id); carryOver(old,plan);
    const st=stats(plan), t=todayIso(); if(st.firstOpen>0) plan.anchor={k:st.firstOpen,date:plan.start>t?plan.start:t};
    put(plan); toast('حُفظ التعديل'); location.hash='#plan-'+plan.id; return; }
  plan.code=newCode(); if(ui.joinCode){ plan.group=ui.joinCode; ui.joinCode=null; }
  put(plan); toast('بدأت الخطة، بارك الله لك'); location.hash='#today';
});

render(); instBanner();
/* fetch the mushaf in the background on first launch, so it is ready (and offline) before the reader opens it */
setTimeout(()=>{ if(!MS && !ui.msDl) msHave().then(h=>{ ui.msHave=h; if(!h && !ui.msDl) msDownload(); }).catch(()=>{}); },2000);
/* reload into a newer version when the site was updated while this page stayed open */
async function checkUpdate(){ if(!FB || !navigator.onLine) return; try{ const t=await (await fetch('index.html?v='+Date.now(),{cache:'no-store'})).text(); const m=t.match(/const APP_VER='([^']+)'/); if(m && m[1]!==APP_VER && !document.querySelector('.sheet') && !document.activeElement?.matches('input,textarea,select')) location.reload(); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
setTimeout(checkUpdate,4000);
setTimeout(()=>{ if(navigator.onLine) loadQuran().catch(()=>{}); },6000);
initStore().then(syncLabel);
</script>
