<style>*{box-sizing:border-box}html,body{margin:0}
/* v2.10 mushaf top bar */
.topbar.mtop{display:flex;align-items:center;gap:2px;padding-block:8px}
.mtl{display:flex;gap:0;flex:none}
.mtb{width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--accent);cursor:pointer;flex:none;padding:0;text-decoration:none}
.mtb svg{width:23px;height:23px;display:block}.mtb:active{background:var(--soft)}
.mtt{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--ink);line-height:1.3;padding:2px 4px;border-radius:12px}
.mtt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mtt small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.mmi>svg{width:22px;height:22px}
.mmsw{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.mmsw button{flex:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.mmsw button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}.mmsw .mthdot{width:34px;height:34px;border-radius:10px}
.fsmp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px;max-height:180px;overflow:auto}
.tfopt.fsz{justify-content:center;gap:18px}.tfopt.fsz b{font-size:18px;min-width:30px;text-align:center}
.mshc{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:12px 14px}
.mshc>span:nth-child(2){flex:1}.mshc small{display:block;color:var(--muted);font-size:12.5px}.mshc small.ok{color:var(--accent)}
.mshi svg{width:30px;height:30px;color:var(--accent)}
.tfsrc{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;text-align:start;font:inherit;color:var(--ink)}
.tfsrc>span{flex:1;display:flex;flex-wrap:wrap;gap:6px}.tfsrc i{font-style:normal;background:var(--soft);color:var(--accent);border-radius:99px;padding:3px 10px;font-size:13px}
.tfsrc>b{color:var(--accent);font-size:14px;flex:none}
.tfls{display:flex;flex-direction:column;gap:8px}
.tfli{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 8px;width:100%;font:inherit;color:var(--ink);text-align:start}
.tfli>b{width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:13px;flex:none}
.tfli>span{flex:1;min-width:0;font-size:15px}.tfli .icon-btn{width:34px;height:34px;font-size:16px}.tfli .icon-btn:disabled{opacity:.3}
.tfli .tfx{color:var(--warn)}.tfli.add{cursor:pointer;border-style:dashed}.tfli.add em{font-style:normal;color:var(--accent);font-weight:700;font-size:14px}
.tatf+.tatf{margin-top:8px}
.tw{border-radius:6px}.wbon{background:rgba(31,140,110,.18);border-radius:6px}
.wbpop{position:fixed;z-index:60;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;max-width:min(300px,calc(100vw - 16px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 14px 8px;box-shadow:0 8px 28px rgba(0,0,0,.22);text-align:center}
.wbpop .wbwar{font-family:"KFGQPC Hafs","Amiri Quran","Amiri",serif;font-size:28px;font-weight:400;line-height:1.6}
.wbpop .wbtr{font-size:15px;color:var(--accent);font-style:italic}.wbpop .wbtl{font-size:15px}
.wbplay{margin-top:4px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--accent);display:grid;place-items:center;cursor:pointer}.wbplay svg{width:20px;height:20px}
.tjsmp{padding-bottom:10px}
.rstars{display:flex;justify-content:center;gap:6px;direction:ltr}.rstars button{font-size:40px;line-height:1;border:0;background:none;color:var(--line);cursor:pointer;padding:2px}.rstars button.on{color:#E8A10F}

body.mreading .mslide{position:fixed;left:14px;right:14px;max-width:612px;margin:0 auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex}
body.mreading:not(.mui) .mslide{display:none}
body.mreading.mui .plbar{bottom:calc(206px + env(safe-area-inset-bottom,0px))}
.mslide input{flex:1;width:100%;margin:0;height:28px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.mslide input::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:var(--soft)}
.mslide input::-moz-range-track{height:6px;border-radius:9px;background:var(--soft)}
.mslide input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.3);margin-top:-10px}
.mslide input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.3)}
.mslb{position:fixed;bottom:calc(196px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap}
.mslb b{display:block;font-size:14px}.mslb span{font-size:15px;color:var(--accent);font-weight:700}

.mthpop{position:fixed;z-index:61;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(300px,calc(100vw - 16px))}
.mthpop button{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;background:none;border-radius:12px;padding:6px 2px;cursor:pointer;color:var(--ink);font:inherit}
.mthpop button.on{border-color:var(--accent);background:var(--soft)}.mthpop .mthdot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}.mthpop small{font-size:11.5px;white-space:nowrap}

/* v2.11 */
.ayw{cursor:pointer;border-radius:6px;padding:0 1px}.ayw.on{background:var(--soft);color:var(--accent)}
#aywp:empty{display:none}#aywp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.aywh{display:flex;align-items:center;justify-content:center;gap:12px}.aywh .wbwar{font-family:"KFGQPC Hafs","Amiri Quran",serif;font-size:30px;font-weight:400}
.aybar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.aychip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer}.aychip.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.ntbox{background:#FFF7DC;border:1px solid #EAD9A0;border-radius:14px;padding:10px 12px;cursor:pointer;color:#3d3420}.ntbox b{font-size:13px;color:#8a6d12}.ntbox p{margin:4px 0 0;white-space:pre-wrap}
.infobox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px}.inforow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.inforow:last-child{border:0}.inforow span{color:var(--muted)}
.rgbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px 10px}.rgbox .sec-l{margin:6px 0}
.tatf{padding:0;overflow:hidden}.tfh{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-bottom:1px solid var(--line)}
.tft{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;font:inherit;color:var(--accent);cursor:pointer;text-align:start;padding:4px}.tft b{margin:0!important;font-size:14.5px}.tft small{color:var(--muted);font-weight:400;font-size:12px;margin-inline-start:6px}
.tft .chev{transform:rotate(90deg);transition:transform .2s;display:grid}.tft .chev svg{width:16px;height:16px}.shut .tft .chev{transform:rotate(-90deg)}
.tfsh{border:0;background:none;color:var(--muted);cursor:pointer;width:34px;height:34px;display:grid;place-items:center}.tfsh svg{width:18px;height:18px}
.tfb{padding:6px 14px 10px}.shut .tfb{display:none}.shut .tfh{border-bottom:0}
.tq{color:#1E8B4E}.tn{color:var(--accent);font-size:.7em}
.noay .tat{display:none}

.tbp{flex:1;text-align:center;font-size:14px;background:rgba(255,255,255,.18);border-radius:10px;padding:8px 4px}
.tffab{position:fixed;inset-inline-start:max(14px,calc(50vw - 306px));bottom:calc(146px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;gap:8px}
.tffab button{width:42px;height:42px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.tfli.off{opacity:.65}.tfdrag{width:28px;text-align:center;font-size:22px;color:var(--muted);cursor:grab;touch-action:none;flex:none}.tfli.drag{box-shadow:0 8px 24px rgba(0,0,0,.2);transform:scale(1.02);background:var(--soft)}
.tfli .circle{flex:none}.tfli>.tfdrag{flex:none;width:26px;text-align:center;font-size:20px;color:var(--muted);cursor:grab;touch-action:none}
.libc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.libh{display:flex;align-items:center;gap:8px}.libh>span{flex:1}.libh small{display:block;color:var(--muted);font-size:12px}.libh .icon-btn{font-size:18px}.libh .icon-btn.on{background:var(--soft)}
.libf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.libf .ok{color:var(--accent)}
.aqcnt{display:flex;gap:8px;margin:0 0 8px}.aqcnt span{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:12.5px;color:var(--muted)}.aqcnt b{display:block;color:var(--accent);font-size:17px}
.rschips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.rschips a{flex:none;background:var(--soft);color:var(--accent);border-radius:99px;padding:6px 12px;text-decoration:none;font-size:13.5px}

*{box-sizing:border-box}

  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

.sheet .grip{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.sheet-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-bottom:10px}
.sheet-head h3{text-align:center}

.icon-btn.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs2{display:flex;background:var(--raised);border-radius:99px;padding:3px;margin-bottom:12px}
.tabs2 button{flex:1;border:0;background:transparent;border-radius:99px;padding:7px;cursor:pointer;color:var(--muted)}
.tabs2 button.on{background:var(--surface);color:var(--accent);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--raised);border-radius:12px;padding:10px 12px;cursor:pointer;border:0;width:100%;text-align:start}
.toggle .circle{pointer-events:none}
.stars{display:flex;gap:8px;justify-content:center;direction:ltr}
.stars button{border:0;background:none;cursor:pointer;padding:2px;font-size:30px;line-height:1;color:var(--line)}
.stars button.on{color:var(--f)}
.counter{display:flex;align-items:center;justify-content:center;gap:18px}
.counter button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-size:20px}
.counter b{font-size:24px;min-width:2ch;text-align:center;color:var(--ok);font-variant-numeric:tabular-nums}
.sec-l{font-size:13px;color:var(--accent);font-weight:600;margin:14px 0 6px}
/* stats */
.ring-wrap{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{font-size:16px;font-variant-numeric:tabular-nums}
.surahs{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}
.surahs .s{display:grid;grid-template-columns:5.5em 1fr 4.5em;gap:8px;align-items:center;font-size:13px}
.surahs .s span:last-child{color:var(--muted);text-align:left;font-variant-numeric:tabular-nums}
.sbar{height:8px;background:var(--raised);border-radius:99px;overflow:hidden;display:flex}
.sbar i{height:100%}
.chart{width:100%;height:auto;display:block}
/* bottom nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;padding:8px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;pointer-events:auto}
.nav .tabs{flex:1;display:flex;justify-content:space-around;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.nav .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);text-decoration:none;border-radius:6px;padding:5px 4px}
.nav .tabs a svg{width:21px;height:21px}
.nav .tabs a.on{background:var(--soft);color:var(--accent);font-weight:600}
.nav .fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,.18);flex:none}
.nav .fab svg{width:26px;height:26px}
.empty{text-align:center;padding:26px 14px}
.empty .orn{font-family:var(--f-display);font-size:42px;color:var(--accent);line-height:1}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%}
.sync{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

.mkc{display:flex;align-items:center;gap:10px;margin-top:4px}
.mkdot{width:30px;height:30px;border-radius:50%;background:var(--mk);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;flex:none;padding:0}
.mkdot.on{box-shadow:0 0 0 2px var(--ink)}
.mkc .btn{margin-inline-start:auto}
.aqrow{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;color:inherit}
.aqh{display:flex;justify-content:space-between;font-size:13px;color:var(--accent);font-weight:700}.aqh small{color:var(--muted);font-weight:400}
.aqt{font-family:"KFGQPC Hafs","Amiri Quran","Amiri",serif;font-size:20px;line-height:1.9}.aqt b{color:var(--accent)}
.ay.flash{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.dlbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.dlbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tfk{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px 0 8px}.tfk button{flex:none;font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}.tfk button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mkls{display:flex;flex-wrap:wrap;gap:8px}.mkl{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:inherit;font-size:14px;background:var(--surface)}.mkl i{width:12px;height:12px;border-radius:50%;background:var(--mk)}
.msdl{text-align:center;display:grid;gap:10px;margin-top:8vh}.msdl .orn{font-size:40px;color:var(--accent);line-height:1}.msdl h3{margin:0;font-family:var(--f-display);font-size:22px}.msdl p{margin:0}
.mstime{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mstime div{background:var(--raised);border-radius:12px;padding:8px 4px;display:grid;gap:2px}.mstime b{font-size:12px;color:var(--muted);font-weight:500}.mstime span{font-size:13px;font-weight:700}
.mstime1{font-weight:700;color:var(--accent)}

/* page colours for reading */
html.mpg:root[data-mth="w"]{--bg:#FFFFFF;--surface:#FFFFFF;--raised:#F1F4F4;--ink:#111816;--muted:#5D6B6A;--line:#E2E8E7;--accent:#118A88;--accent-ink:#fff;--soft:#D5EEED;color-scheme:light}
html.mpg:root[data-mth="y"]{--bg:#FBF3DC;--surface:#FFF9E9;--raised:#F3E8C8;--ink:#2A2315;--muted:#7A6E55;--line:#E8DAB2;--accent:#1F7A68;--accent-ink:#fff;--soft:#EDE2BD;color-scheme:light}
html.mpg:root[data-mth="k"]{--bg:#000000;--surface:#121212;--raised:#1C1C1C;--ink:#ECE8DF;--muted:#9A9792;--line:#262626;--accent:#3CC2BD;--accent-ink:#04201F;--soft:#0E2B2A;color-scheme:dark}
html.mpg:root[data-mth="w"] body,html.mpg:root[data-mth="y"] body,html.mpg:root[data-mth="k"] body{background:var(--bg);color:var(--ink)}
.mthdot{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);vertical-align:middle;background:linear-gradient(135deg,#fff 50%,#1a2425 50%)}
.mthdot.t-w{background:#fff}.mthdot.t-y{background:#FBF3DC;border-color:#D9C68E}.mthdot.t-k{background:#000;border-color:#555}
.mths button{display:flex;align-items:center;justify-content:center;gap:6px}.mthb{padding-inline:10px}
.aqhs{display:flex;flex-wrap:wrap;gap:6px}.aqhs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.toggle.sm{padding:8px 12px;font-size:14px}.toggle.sm .circle{width:22px;height:22px}
.mno.rq{background:none;border:1.5px dashed var(--accent);font-size:15px}.rubt{font-family:"KFGQPC Hafs","Amiri Quran","Amiri",serif;font-size:15px!important}.mpg{text-align:center;line-height:1.5}.rubj{margin:10px 2px 2px}
.aod{display:flex;flex-direction:column;gap:6px;text-align:center;font:inherit;color:inherit;cursor:pointer;width:100%}.aodt{font-family:"KFGQPC Hafs","Amiri Quran","Amiri",serif;font-size:22px;line-height:1.9}.aodt .an{color:var(--accent)}

/* tajweed colours: detailed (d) and simplified (s) */
html[data-tj="d"]{--tj1:#C9971C;--tj2:#E8790F;--tj3:#E0262B;--tj4:#9E1B1B;--tj5:#1E9B3C;--tj6:#9AA0A6;--tj7:#2E4BC8;--tj8:#1BA3E0}
html[data-tj="s"]{--tj1:#E0262B;--tj2:#E0262B;--tj3:#E0262B;--tj4:#E0262B;--tj5:#1E9B3C;--tj6:#1E9B3C;--tj7:#1B8FE0;--tj8:#1B8FE0}
.tj1{color:var(--tj1)}.tj2{color:var(--tj2)}.tj3{color:var(--tj3)}.tj4{color:var(--tj4)}.tj5{color:var(--tj5)}.tj6{color:var(--tj6)}.tj7{color:var(--tj7)}.tj8{color:var(--tj8)}
html[data-tj="0"] [class^="tj"]{color:inherit}
.tjkey{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px}.tjkey span{display:flex;align-items:center;gap:8px}
.tjdot{width:16px;height:16px;border-radius:50%;flex:none}
.tjm-d .tjk1{background:#C9971C}.tjm-d .tjk2{background:#E8790F}.tjm-d .tjk3{background:#E0262B}.tjm-d .tjk4{background:#9E1B1B}.tjm-d .tjk5{background:#1E9B3C}.tjm-d .tjk6{background:#9AA0A6}.tjm-d .tjk7{background:#2E4BC8}.tjm-d .tjk8{background:#1BA3E0}
.tjm-s .tjkr{background:#E0262B}.tjm-s .tjkg{background:#1E9B3C}.tjm-s .tjkb{background:#1B8FE0}.tjm-s .tjkey{grid-template-columns:1fr}
.mnight svg{display:block}.mthb.on{background:var(--soft);color:var(--accent)}
.ay.mkw [class^="tj"]{color:inherit}

/* app colours chosen in الحساب; html.mpg[data-mth] still overrides while reading */
html:root[data-th="w"]{--bg:#FFFFFF;--surface:#FFFFFF;--raised:#F1F4F4;--ink:#111816;--muted:#5D6B6A;--line:#E2E8E7;--accent:#118A88;--accent-ink:#fff;--soft:#D5EEED;--h:#118A88;--f:#C9821B;--t:#6B7FD6;--n:#4E9A5B;--warn:#C9433A;--warn-soft:#F7DEDC;--ok:#2F8F4E;--ok-soft:#DBF0E2;color-scheme:light}
html:root[data-th="y"]{--bg:#FBF3DC;--surface:#FFF9E9;--raised:#F3E8C8;--ink:#2A2315;--muted:#7A6E55;--line:#E8DAB2;--accent:#1F7A68;--accent-ink:#fff;--soft:#EDE2BD;--h:#1F7A68;--f:#B5731A;--t:#5D6FC0;--n:#4E8A4B;--warn:#C9433A;--warn-soft:#F5DCCF;--ok:#2F8F4E;--ok-soft:#DDEBCB;color-scheme:light}
html:root[data-th="g"]{--bg:#2B2E31;--surface:#35393C;--raised:#3F4447;--ink:#ECEDEE;--muted:#A5ABAF;--line:#4A4F53;--accent:#5CC9C4;--accent-ink:#0B2423;--soft:#2F4A49;--h:#5CC9C4;--f:#E5A443;--t:#95A6F2;--n:#77C489;--warn:#EF6F64;--warn-soft:#4A2A28;--ok:#5ACB7D;--ok-soft:#24402F;--shadow:none;color-scheme:dark}
html:root[data-th="k"]{--bg:#000000;--surface:#111111;--raised:#1B1B1B;--ink:#ECE8DF;--muted:#9A9792;--line:#262626;--accent:#3CC2BD;--accent-ink:#04201F;--soft:#0E2B2A;--h:#3CC2BD;--f:#E5A443;--t:#95A6F2;--n:#77C489;--warn:#EF6F64;--warn-soft:#3E2220;--ok:#5ACB7D;--ok-soft:#183627;--shadow:none;color-scheme:dark}
.tailc{border:1.5px solid var(--accent)}
.grtab{width:100%;border-collapse:collapse;font-size:14px;text-align:center}.grtab th,.grtab td{padding:8px 4px;border-bottom:1px solid var(--line)}.grtab thead th{font-size:12px;color:var(--muted);font-weight:600}.grtab tbody th{text-align:start;font-weight:600}.grtab td.ok{color:var(--accent);font-weight:700;font-size:17px}.grtab td.no{color:var(--muted);font-size:17px}.grtab tr.all{background:color-mix(in srgb,var(--accent) 8%,transparent)}.grtab em{font-style:normal;font-size:11px;color:var(--muted)}
.lgpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lgpick button{font:inherit;font-size:15px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer}.lgpick button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
html.en .mp15,html.en .tat,html.en .verse,html.en .qv,html.en .aqt,html.en .mkct,html.en .aodt,html.en .rcw,html.en .mbasm,html.en .aptx,html.en #ghr,html.en .msura,html.en .tav,html.en #mpage,html.en .mpanel{direction:rtl}html.en .tatf{direction:ltr}
.thpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.thpick button{display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:13px;padding:10px 2px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer}.thpick button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.thsw{width:26px;height:26px;border-radius:50%;border:1px solid #0002}.th-a{background:linear-gradient(135deg,#fff 50%,#1a2425 50%)}.th-w{background:#fff}.th-y{background:#FBF3DC}.th-g{background:#2B2E31}.th-k{background:#000}
.tafsv{gap:14px}.tav{border-bottom:1px solid var(--line);padding-bottom:12px}
.tat{font-family:"KFGQPC Hafs","Amiri Quran","Amiri",serif;font-size:var(--tfs,27px);line-height:2.05;color:var(--ink);text-align:justify;text-align-last:start}.tat .an{color:var(--accent)}
.tabtn{display:flex;gap:6px;justify-content:flex-end;margin:2px 0 6px}.tabtn .icon-btn{width:34px;height:34px}

.dlls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.dlls span{display:inline-flex;align-items:center;gap:6px;background:var(--raised);border-radius:99px;padding:4px 6px 4px 12px;font-size:14px}.dlls button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:0 4px}

html.mpg:root[data-mth="l"]{--bg:#E9EBEC;--surface:#F4F5F6;--raised:#DFE2E4;--ink:#16191B;--muted:#5F666B;--line:#D3D7DA;--accent:#118A88;--accent-ink:#fff;--soft:#D3E8E7;color-scheme:light}
html.mpg:root[data-mth="d"]{--bg:#1E1F21;--surface:#28292C;--raised:#313236;--ink:#E9E7E1;--muted:#9C9A95;--line:#38393D;--accent:#3CC2BD;--accent-ink:#04201F;--soft:#173B3A;color-scheme:dark}

html.mpg:root[data-mth] body{background:var(--bg);color:var(--ink)}
.mthdot.t-l{background:#E9EBEC}.mthdot.t-d{background:#1E1F21}.mthdot.t-c{background:#2B2E31}.mthdot.t-n{background:#141C2B}

const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d,12); };
const todayIso = () => iso(new Date());
const fmtG = s => parse(s).toLocaleDateString(LANG==='en'?'en-GB':'ar-EG',{day:'numeric',month:'long',year:'numeric'});
const fmtShort = s => parse(s).toLocaleDateString(LANG==='en'?'en-GB':'ar-EG',{day:'numeric',month:'short'});
let fmtH; try{ const hf=new Intl.DateTimeFormat(LANG==='en'?'en-u-ca-islamic-umalqura':'ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}); fmtH=s=>hf.format(parse(s)); }catch(e){ fmtH=()=> ''; }

/* ---------- sequences & chunks ---------- */
/* earlier memorisation is ordered like the new memorisation, so its last part is the bit next to where today's memorising starts */
function orient(ids,dir){
  const sorted=[...ids].sort((x,y)=>x-y); if(dir!=='rev') return sorted;
  const groups=[]; for(const id of sorted){ const g=groups[groups.length-1]; if(g && sOf[g[0]]===sOf[id]) g.push(id); else groups.push([id]); }
  return groups.reverse().flat();
}
function buildSeq(r){
  if(!r || r.type==='none') return [];
  if(r.type==='span'){ // from (s1,a1) to (s2,a2); s1>s2 means memorising upward, surah by surah
    const clampA=(s,a)=>Math.max(1,Math.min(S[s][1],a||1));
    let {s1,a1,s2,a2}=r; a1=clampA(s1,a1); a2=clampA(s2,a2);
    const id=(s,a)=>S[s][0]+a-1, ids=[];
    if(s1<s2 || (s1===s2 && a1<=a2)){ for(let i=id(s1,a1);i<=id(s2,a2);i++) ids.push(i); return ids; }
    if(s1===s2){ for(let i=id(s1,a2);i<=id(s1,a1);i++) ids.push(i); return ids; }
    for(let s=s1;s>=s2;s--){ const lo= s===s2?1:(s===s1?a1:1), hi = s===s2?a2:S[s][1]; for(let a=lo;a<=hi;a++) ids.push(id(s,a)); }
    return ids;
  }
  const segs=[];
  if(r.type==='juz'){ const a=Math.min(r.from,r.to), b=Math.max(r.from,r.to), lo=JZ[a], hi=JZ[b+1]-1;
    // split into surah pieces so "from An-Nas upward" walks surah by surah
    for(let id=lo; id<=hi; ){ const s=sOf[id], end=Math.min(hi, S[s][0]+S[s][1]-1); segs.push([id,end]); id=end+1; } }
  else { const a=r.type==='all'?1:Math.min(r.from,r.to), b=r.type==='all'?114:Math.max(r.from,r.to); for(let s=a;s<=b;s++) segs.push([S[s][0],S[s][0]+S[s][1]-1]); }
  if(r.dir==='rev') segs.reverse();
  const ids=[]; for(const [x,y] of segs) for(let i=x;i<=y;i++) ids.push(i);
  return ids;
}
function chunk(ids, amt, unit, from=0){
  const out=[], n=ids.length; let i=0;
  while(i<n){
    let acc=0, j=i;
    while(j<n){
      const w=i>=from&&unit!=='ayah'?lwp(ids[j])*(amt<1&&pOf[ids[j]]<=2?amt*pOf[ids[j]]:1):W(ids[j],unit); /* short daily amounts: Al-Fatihah is one session, Al-Baqarah's first page two */
      if(acc+w>amt+1e-6 && j>i){ if(acc+w-amt < amt-acc){acc+=w;j++;} break; }
      acc+=w; j++;
      if(acc>=amt-1e-6) break;
    }
    /* a surah's tail lighter than a quarter page is finished today, so tomorrow starts a fresh surah */
    if(i>=from && j<n && sOf[ids[j]]===sOf[ids[j-1]] && ids[j]===ids[j-1]+1){ let e=j, tw=0; while(e<n && sOf[ids[e]]===sOf[ids[j]] && ids[e]===ids[e-1]+1){ tw+=lwp(ids[e]); e++; }
      if(e===n || sOf[ids[e]]!==sOf[ids[j]]){ if(tw<=Math.min(0.1, unit==='ayah'?1:amt/2)+1e-6) j=e; } }
    out.push([i,j-1]); i=j;
  }
  if(out.length>1){ const t=out[out.length-1]; let tw=0; for(let k=t[0];k<=t[1];k++) tw+=W(ids[k],unit);
    if(tw<amt*0.25){ out.pop(); out[out.length-1][1]=t[1]; } }
  return out;
}
const seqWeight = ids => ids.reduce((a,id)=>a+pw(id),0);

/* a slice of a sequence -> contiguous runs of ayah ids */
function runs(ids,i0,i1){
  const r=[]; let a=ids[i0], b=a;
  for(let k=i0+1;k<=i1;k++){ const id=ids[k]; if(id===b+1 && sOf[id]===sOf[b]) b=id; else if(id===b+1){ b=id; } else { r.push([a,b]); a=b=id; } }
  r.push([a,b]); return r;
}
function runLabel([a,b]){
  const s1=sOf[a], s2=sOf[b];
  if(s1===s2){ const st=aNo[a]===1, en=aNo[b]===S[s1][1], n=NAMES[s1-1];
    /* ayah numbers only where the range starts or stops partway through a surah */
    if(st&&en) return `سورة ${n}`;
    if(st) return `${n} إلى ${f(aNo[b])}`;
    if(en) return `${n} من ${f(aNo[a])}`;
    return `${n} ${f(aNo[a])}${a!==b?'–'+f(aNo[b]):''}`; }
  return `${ptFrom(a)} إلى ${ptTo(b)}`;
}
/* "الذاريات ٨ إلى ق": a surah's name alone when the run starts at its first ayah or ends at its last */
const ptFrom=a=>NAMES[sOf[a]-1]+(aNo[a]>1?' '+f(aNo[a]):'');
const ptTo=b=>NAMES[sOf[b]-1]+(aNo[b]<S[sOf[b]][1]?' '+f(aNo[b]):'');
/* runs that go surah after surah with nothing skipped read as one span */
function spanLabel(rs){
  if(rs.length<2) return null;
  for(let i=0;i<rs.length;i++){ const [a,b]=rs[i];
    if(i>0 && aNo[a]!==1) return null;
    if(i<rs.length-1 && aNo[b]!==S[sOf[b]][1]) return null;
    if(i>0 && Math.abs(sOf[a]-sOf[rs[i-1][1]])!==1) return null; }
  return `${ptFrom(rs[0][0])} إلى ${ptTo(rs[rs.length-1][1])}`;
}
function describe(rs){
  let pages=0, pmin=999, pmax=0;
  for(const [a,b] of rs){ for(let id=a;id<=b;id++) pages+=pw(id); pmin=Math.min(pmin,pOf[a],pOf[b]); pmax=Math.max(pmax,pOf[a],pOf[b]); }
  const label = spanLabel(rs) || (rs.length>4 ? `${ptFrom(rs[0][0])} إلى ${ptTo(rs[rs.length-1][1])}` : rs.map(runLabel).join('، '));
  const [a,b]=rs[0];
  const link = sOf[a]===sOf[b] ? `https://quran.com/${sOf[a]}/${aNo[a]}-${aNo[b]}` : `https://quran.com/${sOf[a]}/${aNo[a]}`;
  return {rs, label, pages, pr: pmin===pmax?`ص ${f(pmin)}`:`ص ${f(pmin)}–${f(pmax)}`, link};
}

/* ---------- plan model ---------- */
const KIND = {h:'حفظ جديد', n:'مراجعة قريبة', f:'مراجعة بعيدة', r:'مراجعة', t:'تلاوة'};
const TYPE_NAME = {hifz:'حفظ', review:'مراجعة', both:'حفظ ومراجعة', tilawa:'تلاوة'};
const isCycle = p => p.type==='review' || p.type==='tilawa';
const cache = new Map();
/* plans made before the «finish a light surah tail» rule keep their old split until the owner opts in; plan.tail is the sequence index the rule starts at */
const tailFrom = p => p.tail==null ? Infinity : p.tail;
function compute(plan){
  const ck = JSON.stringify([plan.type,plan.hifz,plan.review,plan.base,plan.near,plan.far,plan.cycles,plan.tail]);
  let c = cache.get(plan.id); if(c && c.ck===ck) return c;
  const sessions=[];
  if(isCycle(plan)){
    const kind = plan.type==='tilawa'?'t':'r';
    const seq=buildSeq(plan.review.range), ch=chunk(seq,plan.review.amt,plan.review.unit,tailFrom(plan)), m=ch.length;
    for(let k=0;k<m*plan.cycles;k++){ const [i0,i1]=ch[k%m]; sessions.push({tasks:[{key:k+'r',kind,cycle:Math.floor(k/m)+1,...describe(runs(seq,i0,i1))}]}); }
    c={ck,sessions,seq,perCycle:m};
  } else {
    const seq=buildSeq(plan.hifz.range), ch=chunk(seq,plan.hifz.amt,plan.hifz.unit,tailFrom(plan));
    const base = plan.type==='both' ? orient(buildSeq(plan.base), plan.hifz.range.dir) : [];
    const pool = base.concat(seq), P=[0]; for(const id of pool) P.push(P[P.length-1]+pw(id));
    const near = plan.type==='both' ? (plan.near||0) : 0, far = plan.type==='both' ? (plan.far||0) : 0;
    ch.forEach(([i0,i1],k)=>{
      const tasks=[{key:k+'h',kind:'h',i0,i1,...describe(runs(seq,i0,i1))}];
      // near review: either the last `near` sessions, or (nearPages) the last N pages memorised before today's portion, reaching into earlier memorisation
      let nearStart = base.length + (k-near>0 ? ch[k-near][0] : 0);
      if(plan.nearPages>0){
        const end = base.length + i0; let st=end;
        while(st>0 && P[end]-P[st-1] <= plan.nearPages+1e-6) st--;
        if(st<end){ tasks.push({key:k+'n',kind:'n',...describe(runs(pool,st,end-1))}); }
        nearStart = st;
      } else if(near>0 && k>0){ const s0=ch[Math.max(0,k-near)][0], s1=ch[k-1][1]; tasks.push({key:k+'n',kind:'n',...describe(runs(seq,s0,s1))}); }
      if(far>0){
        const L = nearStart, Wt=P[L];
        if(Wt>0.2){
          let slices;
          if(far>=Wt-1e-6) slices=[[0,L-1]];
          else{
            const o=(k*far)%Wt; let s=0; while(s<L && P[s+1]<=o+1e-9) s++;
            let acc=0, e=s, n=0; while(n<L){ acc+=pw(pool[e]); n++; if(acc>=far-1e-6) break; e=(e+1)%L; }
            slices = e>=s ? [[s,e]] : [[s,L-1],[0,e]];
          }
          const rs=[]; for(const [x,y] of slices) rs.push(...runs(pool,x,y));
          tasks.push({key:k+'f',kind:'f',...describe(rs)});
        }
      }
      sessions.push({tasks});
    });
    c={ck,sessions,seq,chunks:ch};
  }
  c.base = c.dates = datesFor(plan, sessions.length);
  c.dk = plan.start+'|'+plan.days.join()+'|'+JSON.stringify(plan.anchor||null); c.rk='null';
  cache.set(plan.id,c); return c;
}
function datesFor(plan,n,roll){
  const out=[], days=new Set(plan.days.length?plan.days:[0,1,2,3,4,5,6]);
  let d=parse(plan.start), k=0;
  const anchor=plan.anchor;
  while(k<n){
    if(anchor && k===anchor.k){ d=parse(anchor.date); }
    if(roll && k===roll.k){ d=parse(roll.date); }
    while(!days.has(d.getDay())) d.setDate(d.getDate()+1);
    out.push(iso(d)); d.setDate(d.getDate()+1); k++;
  }
  return out;
}
/* new memorisation never runs ahead: an unfinished portion stays as the day's wird, and the rest of the plan moves back with it */
const rolls = p => p.type==='hifz' || p.type==='both';
function rollAnchor(plan,base){
  const n=base.length, t=todayIso(); let k=0, doneToday=false;
  for(let j=0;j<n;j++){ const v=plan.done[j+'h']; if(v && iso(new Date(+v))===t) doneToday=true; }
  while(k<n && plan.done[k+'h']) k++;
  if(k>=n) return null;
  const days=new Set(plan.days.length?plan.days:[0,1,2,3,4,5,6]), d=parse(t);
  if(doneToday) d.setDate(d.getDate()+1);
  while(!days.has(d.getDay())) d.setDate(d.getDate()+1);
  const date=iso(d); return date>base[k] ? {k,date} : null;
}
function datesOf(plan){
  const c=compute(plan), dk=plan.start+'|'+plan.days.join()+'|'+JSON.stringify(plan.anchor||null);
  if(c.dk!==dk){ c.base=c.dates=datesFor(plan,c.sessions.length); c.dk=dk; c.rk='null'; }
  if(!rolls(plan)) return c.base;
  const ra=rollAnchor(plan,c.base), rk=JSON.stringify(ra);
  if(c.rk!==rk){ c.dates = ra ? datesFor(plan,c.sessions.length,ra) : c.base; c.rk=rk; }
  return c.dates;
}
/* steps: new memorisation counts in half pages, review and recitation in pages */
const stepsOf = tk => Math.max(1, Math.round(tk.pages*(tk.kind==='h'?2:1)));
const gotOf = (plan,tk) => plan.done[tk.key] ? stepsOf(tk) : Math.min(stepsOf(tk), (plan.prog||{})[tk.key]||0);
function setGot(plan,tk,n){
  const m=stepsOf(tk); n=Math.max(0,Math.min(m,n)); plan.prog=plan.prog||{};
  if(n>=m){ if(!plan.done[tk.key]) plan.done[tk.key]=Date.now(); delete plan.prog[tk.key]; }
  else { delete plan.done[tk.key]; if(n>0) plan.prog[tk.key]=n; else delete plan.prog[tk.key]; }
}
function stats(plan){
  const c=compute(plan), dates=datesOf(plan), t=todayIso();
  let total=0, done=0, sDone=0, firstOpen=-1, overdue=0;
  const roll=rolls(plan);
  c.sessions.forEach((s,k)=>{ let all=true; for(const tk of s.tasks){ total++; if(plan.done[tk.key]) done++; else all=false; }
    if(all) sDone++; else { if(firstOpen<0) firstOpen=k; if(dates[k]<t && !roll) overdue++; } });
  return {total,done,sDone,n:c.sessions.length,firstOpen,overdue,end:dates[dates.length-1]};
}

/* ---------- storage: private per-person store in claude.ai, browser storage as fallback ---------- */
const LS='rafiq-plans-v1';
const state={plans:{}, mode:'local', col:null, q:{}};
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS,JSON.stringify(state.plans)); }catch(e){} }
async function initStore(){
  state.plans = lsLoad();
  if(cloudOn()){ if(auth.s){ try{ await afterSignIn(); }catch(e){ console.warn('cloud',e); } } render(); return; }
  try{
    if(window.claude && window.claude.use){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if(db && uid){
        state.col = db.collection(`data/users/${uid}/app/plans`);
        const snap = await state.col.get();
        const remote={}; snap.docs.forEach(d=>{ const v=d.data(); if(v && v.id) remote[v.id]=v; });
        // carry plans made before sign-in into the account
        for(const id of Object.keys(state.plans)) if(!remote[id]){ remote[id]=state.plans[id]; save(id,remote[id]); }
        state.plans=remote; state.mode='cloud'; lsSave();
      }
    }
  }catch(e){ console.warn('store',e); }
    render();
}
function save(id, data){
  lsSave(); cloudSave(id,data);
  if(!state.col) return;
  const doc=state.col.doc(id);
  state.q[id]=(state.q[id]||Promise.resolve()).then(()=> data===null ? doc.delete() : doc.set(JSON.parse(JSON.stringify(data)))).catch(e=>{ console.warn(e); toast('تعذّر الحفظ في الحساب، بقيت نسخة على هذا الجهاز'); });
}
function put(plan){ state.plans[plan.id]=plan; save(plan.id,plan); }
function del(id){ delete state.plans[id]; cache.delete(id); save(id,null); }

async function idp(path,body){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/${path}?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const code=(j.error&&j.error.message||'').split(' ')[0]; const e=new Error(AUTH_ERR[code]||'تعذّر الاتصال، تأكد من الإنترنت وحاول مرة ثانية.'); e.code=code; throw e; }
  return j;
}
function takeSession(j){ auth.s={uid:j.localId||j.user_id, email:j.email||auth.s?.email, id:j.idToken||j.id_token, rt:j.refreshToken||j.refresh_token, exp:Date.now()+((+(j.expiresIn||j.expires_in)||3600)-120)*1000}; authSave(); }
async function token(){
  if(!auth.s) throw new Error('no session');
  if(Date.now()<auth.s.exp) return auth.s.id;
  const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.s.rt)});
  if(!r.ok){ if(r.status===400){ signOut(); } throw new Error('refresh'); }
  takeSession(await r.json()); return auth.s.id;
}
async function rtdb(path,method='GET',data){
  const r=await fetch(`${FB.db}/${path}.json?auth=${await token()}`,{method, headers:{'Content-Type':'application/json'}, body: data===undefined?undefined:JSON.stringify(data)});
  if(!r.ok) throw new Error('db '+r.status);
  try{ return await r.json(); }catch(e){ throw new Error('تعذّر الاتصال، تأكد من الإنترنت وحاول مرة ثانية.'); }
}
/* Firebase drops empty objects and arrays, so put back what a plan needs */
function normPlan(p){ p.done=p.done||{}; p.days=p.days||[]; if(p.prog===undefined) delete p.prog; return p; }

/* phone OR email: an account made with a phone only signs in through a fixed address made from the number;
   logins/<number> points a number to the account's sign-in address so either one can be used to log in */
const PHONE_DOM='phone.rabi-alquran.app';
const normDigits=t=>(t||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[\s\-()]/g,'');
const phoneOk=p=>/^\+?\d{9,15}$/.test(p);
function phoneKey(p){ let d=normDigits(p).replace(/^\+/,'').replace(/^00/,''); if(/^05\d{8}$/.test(d)) d='966'+d.slice(1); else if(/^5\d{8}$/.test(d)) d='966'+d; return d; }
const phoneMail=p=>`p${phoneKey(p)}@${PHONE_DOM}`;
const isPhoneMail=e=>(e||'').toLowerCase().endsWith('@'+PHONE_DOM);
const realEmail=()=>{ const e=auth.profile?.email||auth.s?.email||''; return isPhoneMail(e)?'':e; };
async function loginOf(phone){ try{ const r=await fetch(`${FB.db}/logins/${phoneKey(phone)}.json`); if(!r.ok) return null; const v=await r.json(); return typeof v==='string'?v:null; }catch(e){ return null; } }
async function setLogin(phone,val){ if(!phone) return; try{ await rtdb(`logins/${phoneKey(phone)}`, val?'PUT':'DELETE', val?val:undefined); }catch(e){} }
async function signUp({first,last,phone,email,password}){
  if(phone && await loginOf(phone)){ const e=new Error('رقم الجوال هذا مسجّل من قبل. سجّل دخولك بدلاً من ذلك.'); e.code='PHONE_EXISTS'; throw e; }
  const login=email||phoneMail(phone);
  try{ takeSession(await idp('accounts:signUp',{email:login,password,returnSecureToken:true})); }
  catch(e){ if(e.code==='EMAIL_EXISTS' && !email) e.message='رقم الجوال هذا مسجّل من قبل. سجّل دخولك بدلاً من ذلك.'; throw e; }
  auth.profile={first,last,phone:phone||'',email:email||'',created:Date.now()};
  await rtdb(`users/${auth.s.uid}/profile`,'PUT',auth.profile);
  if(phone) await setLogin(phone,login);
  await afterSignIn();
}
async function signIn(id,password){
  let login=id;
  if(!id.includes('@')) login=(await loginOf(id))||phoneMail(id);
  takeSession(await idp('accounts:signInWithPassword',{email:login,password,returnSecureToken:true}));
  await afterSignIn();
}

/* load the account's plans; plans made on this device before signing in move into the account */
async function afterSignIn(){
  const [prof,remote,grs]=await Promise.all([rtdb(`users/${auth.s.uid}/profile`), rtdb(`users/${auth.s.uid}/plans`), rtdb(`users/${auth.s.uid}/groups`).catch(()=>null)]);
  auth.profile=prof||auth.profile;
  const plans={}; for(const [id,p] of Object.entries(remote||{})) plans[id]=normPlan(p);
  for(const [id,p] of Object.entries(state.plans)) if(!plans[id]){ plans[id]=p; rtdb(`users/${auth.s.uid}/plans/${id}`,'PUT',p).catch(()=>{}); }
  state.plans=plans; state.mode='cloud'; lsSave();
  for(const p of Object.values(plans)) if(!p.code){ p.code=newCode(); cloudSave(p.id,p); }
  const groups={...(grs||{})}; let moved=false; // plans shared the old way (one code per plan) become a حلقة
  for(const p of Object.values(plans)) if(p.group && !groups[p.group]){ groups[p.group]={name:'', plan:p.id, at:p.created||Date.now()}; moved=true; }
  state.groups=groups; if(moved) grStore(); else { try{ localStorage.setItem(GR_LS,JSON.stringify(groups)); }catch(e){} }
  pushAllGroups();
}
async function cloudInit(){
  if(!cloudOn() || !auth.s) return;
  try{ await afterSignIn(); }catch(e){ console.warn('cloud',e); }
}
const cq={};
function cloudSave(id,data){
  if(!cloudOn() || !auth.s) return;
  cq[id]=(cq[id]||Promise.resolve()).then(()=>rtdb(`users/${auth.s.uid}/plans/${id}`, data===null?'DELETE':'PUT', data===null?undefined:JSON.parse(JSON.stringify(data))))
    .catch(e=>{ console.warn(e); toast('تعذّر الحفظ في حسابك، بقيت نسخة على هذا الجهاز'); });
  if(data) pushGroup(data);
}

/* ---------- friends: every plan has a code; whoever enters it shares progress with you ---------- */
const rid=(n,abc)=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>abc[x%abc.length]).join('');
const newCode=()=>rid(6,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
const myName = () => auth.profile ? `${auth.profile.first||''} ${auth.profile.last||''}`.trim() : '';
function summary(plan){
  const sg=stages(plan), cs=sg.list[sg.cur]||{no:1,pct:0}, c=compute(plan), ds=datesOf(plan), t=todayIso();
  let total=0, done=0, pages=0;
  const ks={};
  for(const k of todayKeys(plan,c,ds,t)) for(const tk of c.sessions[k].tasks){ total++; if(plan.done[tk.key]) done++; const g=tk.kind==='r'||tk.kind==='t'?'f':tk.kind; ks[g]=(ks[g]===0?0:1)&(plan.done[tk.key]?1:0); }
  for(const s of c.sessions) for(const tk of s.tasks) if(tk.kind==='h' && plan.done[tk.key]) pages+=tk.pages;
  return {name:myName()||'صديق', plan:plan.name, type:plan.type, stage:cs.no, pct:cs.pct, done, total, pages:Math.round(pages*10)/10, ks, streak:streakInfo().n, day:t, at:Date.now()};
}
/* ---------- الحلقة: a group of friends; each member shares one plan (or none) and sees everyone's day ---------- */
const GR_LS='rafiq-groups';
state.groups={}; try{ state.groups=JSON.parse(localStorage.getItem(GR_LS)||'{}')||{}; }catch(e){}
function grStore(){ try{ localStorage.setItem(GR_LS,JSON.stringify(state.groups)); }catch(e){}
  if(cloudOn() && auth.s) rtdb(`users/${auth.s.uid}/groups`,'PUT',Object.keys(state.groups).length?state.groups:null).catch(e=>console.warn('groups',e)); }
/* what a friend needs to start the same plan: its settings, without anyone's progress */
function planTpl(plan){ const t=JSON.parse(JSON.stringify(plan)); for(const k of ['id','created','done','rec','prog','code','group','anchor','status']) delete t[k]; return t; }
function memberEntry(code){
  const g=state.groups[code], plan=g&&state.plans[g.plan];
  const base = plan ? {...summary(plan), tpl:planTpl(plan)} : {name:myName()||'صديق', plan:'', streak:streakInfo().n, day:todayIso(), at:Date.now()};
  return {...base, gname:(g&&g.name)||''};
}
const gTimers={};
function pushMember(code){
  if(!cloudOn() || !auth.s || !state.groups[code]) return Promise.resolve();
  return rtdb(`groups/${code}/members/${auth.s.uid}`,'PUT',memberEntry(code));
}
function pushGroup(plan){
  if(!cloudOn() || !auth.s) return;
  for(const [code,g] of Object.entries(state.groups)) if(g.plan===plan.id){
    clearTimeout(gTimers[code]); gTimers[code]=setTimeout(()=>pushMember(code).catch(e=>console.warn('group',e)),800); }
}
function pushAllGroups(){ for(const code of Object.keys(state.groups)) pushMember(code).catch(()=>{}); }
let grDay=null; function grFresh(){ const t=todayIso(); if(grDay!==t && cloudOn() && auth.s){ grDay=t; pushAllGroups(); } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) grFresh(); });
async function groupMembers(code){ const m=await rtdb(`groups/${code}/members`); return m||{}; }
const groupName=(code,ms)=>(state.groups[code]&&state.groups[code].name)||Object.values(ms||{}).map(m=>m.gname).find(Boolean)||'الحلقة';
async function createGroup(name,pid){
  const code=newCode(); state.groups[code]={name, plan:pid||null, at:Date.now(), own:1}; grStore();
  await pushMember(code); return code;
}
async function joinGroup(code,pid,ms){
  ms=ms||await groupMembers(code);
  state.groups[code]={name:groupName(code,ms), plan:pid||null, at:Date.now()}; grStore();
  await pushMember(code);
}
async function setGroupPlan(code,pid){ if(!state.groups[code]) return; state.groups[code].plan=pid||null; grStore(); await pushMember(code); }
async function leaveGroup(code){
  delete state.groups[code]; grStore();
  await rtdb(`groups/${code}/members/${auth.s.uid}`,'DELETE').catch(()=>{});
}

/* ---------- account page ---------- */
async function saveProfile(p){
  auth.profile={...(auth.profile||{}), ...p};
  await rtdb(`users/${auth.s.uid}/profile`,'PUT',auth.profile);
  pushAllGroups();
}
async function sendSupport(msg){
  const pr=auth.profile||{};
  await rtdb(`support/${auth.s.uid}`,'POST',{msg, name:myName(), email:realEmail(), phone:pr.phone||'', at:Date.now(), ver:typeof APP_VER!=='undefined'?APP_VER:''});
}
async function deleteAccount(){
  const uid=auth.s.uid, id=await token();
  for(const code of Object.keys(state.groups)) await rtdb(`groups/${code}/members/${uid}`,'DELETE').catch(()=>{});
  await rtdb(`users/${uid}`,'DELETE');
  await idp('accounts:delete',{idToken:id});
  signOut();
}

/* ---------- stages of three juz (progress the user sees) ---------- */
function seqSlice(plan,k){ const c=compute(plan); if(!c.rch) c.rch=chunk(c.seq,plan.review.amt,plan.review.unit,tailFrom(plan)); const [a,b]=c.rch[k]; return c.seq.slice(a,b+1); }
/* stages are fixed groups of three juz in the plan's order: 30–28, 27–25, … (or 1–3, 4–6, …).
   For memorisation, what the person already memorised counts as done. */
const planDir = p => (isCycle(p)?p.review:p.hifz).range.dir==='rev' ? 'rev' : 'fwd';
const stageOfJuz = (dir,j) => dir==='rev' ? Math.floor((30-j)/3) : Math.floor((j-1)/3);
function stages(plan){
  const c=compute(plan), seq=c.seq, dir=planDir(plan), wt={}, got={};
  const add=id=>{ const j=jOf[id]; if(!(j in wt)){ wt[j]=0; got[j]=0; } wt[j]+=pw(id); };
  const base = !isCycle(plan) && plan.base && plan.base.type!=='none' ? buildSeq(plan.base) : [];
  for(const id of base){ add(id); got[jOf[id]]+=pw(id); }
  for(const id of seq) add(id);
  let cycle=1;
  if(isCycle(plan)){
    const m=c.perCycle; let n=0; for(let k=0;k<c.sessions.length;k++) if(plan.done[k+'r']) n++;
    cycle=Math.min(plan.cycles, Math.floor(n/m)+1);
    const base=(cycle-1)*m;
    for(let k=0;k<m;k++){ const tk=c.sessions[base+k].tasks[0], fr=gotOf(plan,tk)/stepsOf(tk); if(fr>0) for(const id of seqSlice(plan,k)) got[jOf[id]]+=pw(id)*fr; }
  } else c.chunks.forEach(([i0,i1],k)=>{ const tk=c.sessions[k].tasks[0], fr=gotOf(plan,tk)/stepsOf(tk); if(fr>0) for(let i=i0;i<=i1;i++) got[jOf[seq[i]]]+=pw(seq[i])*fr; });
  const groups={};
  for(const j of Object.keys(wt).map(Number)) (groups[stageOfJuz(dir,j)] ||= []).push(j);
  const out=Object.keys(groups).map(Number).sort((a,b)=>a-b).map(g=>{ const js=groups[g].sort((a,b)=>dir==='rev'?b-a:a-b); let w=0,x=0; for(const j of js){ w+=wt[j]; x+=got[j]; }
    return {no:g+1, js, pct: w? Math.min(100,Math.floor(x/w*100+1e-6)) : 0}; });
  const cur=out.findIndex(x=>x.pct<100), jStage={}; out.forEach((x,i)=>x.js.forEach(j=>jStage[j]=i));
  return {list:out, cur: cur<0? out.length-1 : cur, cycle, jStage};
}
/* date of the last session that belongs to stage i (null if none left) */
function stageEnd(plan,sg,i){ const c=compute(plan), ds=datesOf(plan), n=isCycle(plan)?c.perCycle:c.sessions.length, off=isCycle(plan)?(sg.cycle-1)*c.perCycle:0;
  let last=-1; for(let k=off;k<off+n;k++) if(sessionStage(plan,k,sg)===i) last=k; return last<0?null:ds[last]; }
/* a session belongs to the stage of its juz, but stages never go backwards in plan order: when a surah crosses a juz line
   (e.g. Fussilat 1-46 is juz 24, 47-54 juz 25) its sessions stay in the stage that is still running, so none go missing */
function sessionStage(plan,k,sg){ const c=compute(plan), cy=isCycle(plan), m=cy?c.perCycle:c.sessions.length, key=JSON.stringify(sg.jStage);
  if(c.ssK!==key){ const r=[]; for(let i=0;i<m;i++){ const id=cy?seqSlice(plan,i)[0]:c.seq[c.chunks[i][0]]; r.push(sg.jStage[jOf[id]] ?? Infinity); }
    for(let i=m-2;i>=0;i--) r[i]=Math.min(r[i],r[i+1]); c.ss=r.map(x=>x===Infinity?undefined:x); c.ssK=key; }
  return c.ss[cy?k%m:k]; }
const juzNames = js => js.length===1 ? `الجزء ${f(js[0])}` : `الأجزاء ${js.map(f).join(' و')}`;

const stkW=n=>n===1?'يوم متواصل':n>10?'يوماً متواصلاً':'أيام متواصلة';
function streakInfo(){
  const days=new Set();
  for(const p of Object.values(state.plans)) for(const v of Object.values(p.done)) if(v) days.add(iso(new Date(+v)));
  const act=Object.values(state.plans).filter(p=>status(p)==='active'), study=new Set(); for(const p of act) for(const w of (p.days&&p.days.length?p.days:[0,1,2,3,4,5,6])) study.add(w);
  const rest=x=>study.size>0 && !study.has(x.getDay());
  let n=0; const d=new Date(); if(!days.has(iso(d))) d.setDate(d.getDate()-1);
  for(let g=0; g<800; g++){ if(days.has(iso(d))) n++; else if(!rest(d)) break; d.setDate(d.getDate()-1); }
  const wk=[]; const s=new Date(); s.setDate(s.getDate()-s.getDay()); // week starts Sunday
  for(let i=0;i<7;i++){ const x=new Date(s); x.setDate(s.getDate()+i); wk.push({iso:iso(x), on:days.has(iso(x))}); }
  return {n, wk};
}

/* rest days: nothing due → a real rest. Overdue sessions are made up one session a day, only on Thu/Fri/Sat rest days */
const CATCH_DAYS=new Set([4,5,6]);
/* the sessions that belong to today: same rules as the «المهام» page */
function todayKeys(p,c,ds,t){ let ks=[]; ds.forEach((d,k)=>{ if(d===t) ks.push(k); });
  if(rolls(p)){ c.sessions.forEach((s,k)=>{ const v=p.done[k+'h']; if(v && iso(new Date(+v))===t && !ks.includes(k)) ks.push(k); }); ks.sort((x,y)=>x-y); }
  if(!ks.length && status(p)==='active'){ const wd=parse(t).getDay(), studyDay=new Set(p.days.length?p.days:[0,1,2,3,4,5,6]).has(wd); if(!studyDay && CATCH_DAYS.has(wd)) ks=catchUp(p,c,ds,t); }
  return ks; }
function catchUp(p,c,ds,t){
  const today=[]; c.sessions.forEach((s,k)=>{ if(s.tasks.some(tk=>{ const v=p.done[tk.key]; return v && iso(new Date(+v))===t; })) today.push(k); });
  if(today.length) return today;                       // already made up a day today: that's enough
  const due=rolls(p)?c.base:ds;                         // rolling plans shift their dates, so compare with the original schedule
  const k=c.sessions.findIndex((s,k)=>due[k]<t && !sessDone(p,s));
  return k<0?[]:[k];
}
function vToday(){
  const t=todayIso(), all=plansSorted(), ps=all.filter(p=>status(p)==='active'), wd=new Date().getDay();
  if(!all.length) return hello()+emptyState();
  let out='', many=ps.length>1, total=0, done=0, nextDay=null; const lis={};
  for(const p of ps){ const c=compute(p), ds=datesOf(p);
    let ks=[]; ds.forEach((d,k)=>{ if(d===t) ks.push(k); });
    if(rolls(p)){ c.sessions.forEach((s,k)=>{ const v=p.done[k+'h']; if(v && iso(new Date(+v))===t && !ks.includes(k)) ks.push(k); }); ks.sort((x,y)=>x-y); }
    let note='';
    if(!ks.length){
      if(ds.findIndex(d=>d>=t)<0 && ds.every((d,k)=>sessDone(p,c.sessions[k]))){ out+=`<div class="card well">${many?`<b>${esc(p.name)}</b>: `:''}أتممت هذه الخطة. تقبّل الله منك.</div>`; continue; }
      const studyDay=new Set(p.days.length?p.days:[0,1,2,3,4,5,6]).has(wd);
      if(!studyDay && CATCH_DAYS.has(wd)){ ks=catchUp(p,c,ds,t); if(ks.length) note=`<div class="carry">عندك ورد فاتك، هذا تعويض يوم واحد فقط، وبعده ارتاح.</div>`; }
      if(!ks.length){ const nx=ds.find(d=>d>t); if(nx && (!nextDay||nx<nextDay)) nextDay=nx; continue; }
    }
    const carried = !note && rolls(p) && ks.some(k=>!p.done[k+'h'] && c.base[k]<t);
    const tiles=ks.map(k=>c.sessions[k].tasks.map((tk,i)=>{ total++; if(p.done[tk.key]) done++; const g=tk.kind==='h'?'h':tk.kind==='n'?'n':tk.kind==='t'?'t':'f'; (lis[g]=lis[g]||[]).push(...tk.rs); return taskTile(p,k,i); }).join('')).join('');
    out+=`<section class="tday">${many?`<a class="tday-h" href="#plan-${p.id}">${esc(p.name)}</a>`:''}${note}${carried?`<div class="carry">حفظك السابق لم يكتمل، فبقي هو ورد اليوم. أكمله ثم ننتقل للجديد.</div>`:''}<div class="tgrid">${tiles}</div></section>`;
  }
  ui.todayListen=lis;
  const all_done = total && done===total;
  const restCard = `<div class="card restday"><div class="orn" aria-hidden="true">🌿</div><h3>اليوم استراحة</h3><p class="muted">ارتح وجدّد نشاطك${nextDay?`، نلقاك ${WD[parse(nextDay).getDay()]} إن شاء الله`:''}.</p></div>`;
  return hello(total?`${f(done)} من ${f(total)}`:'')+`<div class="stack">
    ${ps.map(tailCard).join('')}
    ${all_done?`<div class="card well">أحسنت، أنهيت مهام اليوم كلها. بارك الله فيك.</div>`:''}
    ${out || (ps.length?restCard:`<div class="card small muted">كل الخطط موقوفة. افتح «الخطط» لاستئناف واحدة.</div>`)}
    ${total?listenCard(lis):''}
    ${total?quizCard(lis):''}

  </div>`;
}

/* page count of a PDF before downloading: lay out the same page and split it the same way */
function pdfLayout(plan,scope,rng){
  const box=document.createElement('div'); box.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;padding:40px 38px;box-sizing:border-box';
  box.innerHTML=printDoc(plan,scope,rng); document.body.appendChild(box);
  const pageH=Math.round(794*297/210), top0=box.getBoundingClientRect().top;
  const cuts=[...box.querySelectorAll('.pd-tb tr,section,header,footer')].map(r=>r.getBoundingClientRect().bottom-top0).sort((a,b)=>a-b);
  const pages=[]; let y=0; const H=box.offsetHeight;
  while(y<H-2){ const lim=pages.length?pageH-56:pageH; let e=Math.min(H,y+lim); if(e<H){ const c=cuts.filter(v=>v>y+lim*.5&&v<=e).pop(); if(c) e=c; } pages.push([y,e]); y=e; }
  return {box,pages,pageH};
}
async function pdfCounts(plan,only){

/* a real PDF file saved to the device (the print dialog does not open inside installed apps on many phones) */
const loadJs=src=>new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
let pdfBusy=false;
async function savePdf(plan,scope,rng){
  if(pdfBusy) return; pdfBusy=true; toast('جارٍ تجهيز ملف PDF…');
  let box=null;
  try{
    if(!window.html2canvas) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await (document.fonts&&document.fonts.ready);
    const L=pdfLayout(plan,scope,rng); box=L.box; const {pages,pageH}=L;
    const sc=1.6, cv=await html2canvas(box,{scale:sc,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'px',format:[794,pageH],hotfixes:['px_scaling']});
    pages.forEach(([a,b],i)=>{ const c=document.createElement('canvas'); c.width=cv.width; c.height=Math.round((b-a)*sc);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(cv,0,Math.round(a*sc),cv.width,c.height,0,0,cv.width,c.height);
      if(i) doc.addPage([794,pageH]); doc.addImage(c.toDataURL('image/jpeg',.86),'JPEG',0,i?28:0,794,b-a); });
    const blob=doc.output('blob'), name=`ربيع القرآن - ${plan.name}.pdf`.replace(/[\\/:*?"<>|]/g,'');
    const file=new File([blob],name,{type:'application/pdf'}), ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
    if(ios && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}).catch(()=>{}); }
    else { const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); toast('تم حفظ الملف في التنزيلات'); }
  }catch(e){ toast('ما قدرنا نجهّز الملف، تأكد من الاتصال وجرب مرة ثانية'); }
  finally{ box&&box.remove(); pdfBusy=false; }
}

/* returns {plan} or {err} */
function planFromForm(form){
  const type=rv(form,'ptype'), cyc=type==='review'||type==='tilawa', dir=dirOf(form), {first,last}=ends(dir);
  const m=readPt(form,'m-'), b=readPt(form,'b-'), e=readPt(form,'e-');
  let range, base={type:'none'}, err='';
  if(type==='hifz'||type==='both'){
    const st = m ? nextPt(dir,m) : first;
    if(!st) { err='ما شاء الله، محفوظك يصل إلى آخر المصحف. اختر «مراجعة» بدلاً من الحفظ.'; range=spanOf(dir,first,last); }
    else range=spanOf(dir,st,last);
    if(m) base=spanOf(dir,first,m);
  } else if(type==='review'){
    if(!m){ err='اختر إلى أين وصل حفظك.'; range=spanOf(dir,first,first); } else range=spanOf(dir,first,m);
  } else {
    if(!b || !e || posOf(dir,b)>posOf(dir,e)){ err='اختر بداية قبل النهاية.'; range=spanOf(dir,first,last); } else range=spanOf(dir,b,e);
  }
  const qa=rv(form,'qa'); let unit='page', amt=parseFloat(qa)||1;
  if(qa==='c'){ unit=cyc?form.querySelector('#unit').value:'page'; amt=Math.max(0.1,parseFloat(form.querySelector('#amt').value)||1); if(unit==='juz'){ unit='page'; amt*=20; } }
  const days=[...form.querySelectorAll('input[name=wd]:checked')].map(i=>+i.value).sort();
  const plan={id:'p'+Date.now().toString(36), created:Date.now(), type, tail:0, status:'active', days:days.length?days:[0,1,2,3,4,5,6], start:form.querySelector('#start').value||todayIso(), done:{}};
  const block={range,amt,unit};
  if(cyc){ plan.review=block; plan.cycles=Math.max(1,Math.min(400,parseInt(form.querySelector('#cycles').value)||1)); } else plan.hifz=block;
  if(type==='both'){ plan.near=0; plan.nearPages=Math.max(0,parseFloat(form.querySelector('#near').value)||0); plan.far=Math.max(0,parseFloat(form.querySelector('#far').value)||0); }
  if(!cyc) plan.base=base;
  plan.name=form.querySelector('#pname').value.trim() || `${type==='tilawa'?'ختمة':TYPE_NAME[type]} ${rangeName(range)}`;
  plan.err=err; return plan;
}
function fillForm(form,pl){
  const b=isCycle(pl)?pl.review:pl.hifz, dir=b.range.dir==='rev'?'rev':'fwd';
  setRadio(form,'pdir',dir); setRadio(form,'ptype',pl.type); fillSurahs(form);
  const seq=compute(pl).seq, P=id=>[sOf[id],aNo[id]], {first,last}=ends(dir);
  if(pl.type==='hifz'||pl.type==='both'){ setPt(form,'m-',prevPt(dir,P(seq[0]))); setPt(form,'e-',P(seq[seq.length-1])); setPt(form,'b-',first); }
  else if(pl.type==='review'){ setPt(form,'m-',P(seq[seq.length-1])); setPt(form,'b-',first); setPt(form,'e-',last); }
  else { setPt(form,'m-',null); setPt(form,'b-',P(seq[0])); setPt(form,'e-',P(seq[seq.length-1])); }
  form.dataset.amt = b.unit==='page' && (isCycle(pl)?[1,5,10,20]:[0.25,1/3,0.5,1]).some(v=>Math.abs(v-b.amt)<1e-9) ? String(b.amt) : 'c';
  form.querySelector('#amt').value=Math.round(b.amt*100)/100; form.querySelector('#unit').value=b.unit;
  if(pl.cycles) form.querySelector('#cycles').value=pl.cycles;
  if(pl.type==='both'){ form.querySelector('#near').value=pl.nearPages ?? (pl.near*b.amt); form.querySelector('#far').value=pl.far; }
  form.querySelectorAll('input[name=wd]').forEach(i=>i.checked=pl.days.includes(+i.value));
  form.querySelector('#start').value=pl.start; form.querySelector('#pname').value=pl.name;
}
function syncForm(form,changed){

  if(changed){
    if(changed.name==='pdir'){ fillSurahs(form); setPt(form,'e-',last); setPt(form,'b-',first);
      const m=readPt(form,'m-'); if(m) fillAyat(form,'m-'); }
    else if(changed.name==='ptype' && type==='review' && !readPt(form,'m-')) setPt(form,'m-', dir==='rev'?[78,40]:[1,7]);
    else if(/^[mbe]-s$/.test(changed.id||'')){ const p=changed.id.slice(0,2); fillAyat(form,p, p==='b-'?1:S[+changed.value]?.[1]); }
  }
  const set=cyc?AMTS.rev:AMTS.mem, want=form.dataset.amt || rv(form,'qa') || (cyc?'20':'1');
  const pick = set.some(([v])=>String(v)===want) ? want : String(cyc?20:1);

    m ? (type==='both' ? `يبدأ حفظك الجديد بعدها مباشرة، وتراجع من سورة ${startName} إلى هنا، ويُضاف لها كل ما تحفظه.` : `يبدأ حفظك الجديد بعدها مباشرة، وتستمر حتى سورة ${NAMES[last[0]-1]}.`) : `يبدأ حفظك من سورة ${startName} حتى سورة ${NAMES[last[0]-1]}.`;
  form.querySelectorAll('[data-only]').forEach(el=>el.hidden=!el.dataset.only.split(' ').includes(type));

  const sg=stages(tmp), cs=sg.list[sg.cur], end=stageEnd(tmp,sg,sg.cur)||ds[ds.length-1], fst=c.sessions[0].tasks;
  const span=Math.round((parse(end)-parse(ds[0]))/864e5)+1, days=plural(span,'يوم واحد','يومين','أيام','يوماً');
  const head = sg.list.length>1 ? `${hif?'تختم حفظ':'تنهي'} المرحلة ${f(cs.no)} (${juzNames(cs.js)}) خلال ${days} بإذن الله` : `تنهي ${rangeName(p.hifz?p.hifz.range:p.review.range)} خلال ${days} بإذن الله`;
  const had = hif && cs.pct>0 ? `<span class="good">ممتاز، أنجزت ${f(cs.pct)}٪ من هذه المرحلة بحفظك السابق${sg.cur>0?`، و${plural(sg.cur,'مرحلة كاملة','مرحلتين كاملتين','مراحل كاملة','مرحلة كاملة')} قبلها`:''}.</span>`
    : hif && sg.cur>0 ? `<span class="good">ممتاز، أنهيت ${plural(sg.cur,'مرحلة كاملة','مرحلتين كاملتين','مراحل كاملة','مرحلة كاملة')} بحفظك السابق.</span>` : '';

/* ---------- harvest (stats) ---------- */
function harvest(){
  const mem=new Set(), rev=new Set(), til=new Set(), perDay={}, kinds={h:0,r:0,t:0};
  const today=new Date(); const day0=new Date(today); day0.setDate(today.getDate()-6);
  for(const p of Object.values(state.plans)){ const c=compute(p);
    c.sessions.forEach(s=>s.tasks.forEach(tk=>{ const ts=p.done[tk.key]; if(!ts) return;
      const set = tk.kind==='h'?mem: tk.kind==='t'?til: rev; let n=0;
      for(const [a,b] of tk.rs) for(let id=a;id<=b;id++){ set.add(id); n++; }
      const k = tk.kind==='h'?'h':tk.kind==='t'?'t':'r', di=iso(new Date(+ts));
      (perDay[di]=perDay[di]||{h:0,r:0,t:0})[k]+=n; kinds[k]+=n; })); }
  return {mem,rev,til,perDay,kinds};
}
function ring(vals){ // concentric arcs, fraction of 6236 each
  const R=[54,42,30], col=['var(--h)','var(--f)','var(--t)'];
  return `<svg viewBox="0 0 130 130" width="130" height="130" role="img" aria-label="نصيبك من المصحف">${vals.map((v,i)=>{ const r=R[i], C=2*Math.PI*r, len=Math.max(0,Math.min(1,v/NA))*C;
    return `<circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--raised)" stroke-width="9"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="${col[i]}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 65 65)" ${len<0.5?'opacity="0"':''}/>`; }).join('')}</svg>`;
}
function weekCmp(perDay){ const sum=(a,b)=>{ let n=0; for(let i=a;i<=b;i++){ const d=new Date(); d.setDate(d.getDate()-i); const v=perDay[iso(d)]; if(v) n+=v.h+v.r+v.t; } return n; };
  const a=sum(0,6), b=sum(7,13); if(!a&&!b) return '';
  const up=a>=b, pct=b?Math.round(Math.abs(a-b)/b*100):0;
  return `<div class="wkcmp"><span>هذا الأسبوع <b>${f(a)}</b> آية</span><span>الأسبوع الماضي <b>${f(b)}</b></span>${b?`<em class="${up?'up':'down'}">${up?'▲':'▼'} ${f(pct)}٪</em>`:''}</div>`; }
function monthCard(perDay){ const now=new Date(), y=now.getFullYear(), m=now.getMonth(), n=new Date(y,m+1,0).getDate(), first=new Date(y,m,1).getDay(), t=todayIso();
  let on=0, cells=''; for(let i=0;i<first;i++) cells+='<i class="mc0"></i>';
  for(let d=1; d<=n; d++){ const k=iso(new Date(y,m,d)), v=perDay[k], tot=v?v.h+v.r+v.t:0, lv=!tot?0:tot<20?1:tot<60?2:3; if(tot) on++;
    cells+=`<i class="mc l${lv}${k===t?' td':''}${k>t?' fu':''}" title="${f(d)}">${f(d)}</i>`; }
  const past=Math.min(n, now.getDate());
  return `<section class="card"><div class="tile-row"><h3 style="margin:0">هذا الشهر</h3><span class="small muted">أيام الإنجاز <b style="color:var(--accent)">${f(on)}</b> من ${f(past)}</span></div>
    <div class="mcal">${['ح','ن','ث','ر','خ','ج','س'].map(x=>`<b>${x}</b>`).join('')}${cells}</div>
    <div class="mclg small muted"><span>أقل</span><i class="mc l1"></i><i class="mc l2"></i><i class="mc l3"></i><span>أكثر</span></div></section>`; }
function weekChart(perDay){
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(iso(d)); }
  const vals=days.map(d=>perDay[d]||{h:0,r:0,t:0}), max=Math.max(10,...vals.map(v=>v.h+v.r+v.t));
  const W=320,H=150,pl=8,pb=22,bw=26, step=(W-pl*2)/7;
  let bars='';
  vals.forEach((v,i)=>{ const x=(LANG==='en'?pl+step*(i+0.5):W-pl-step*(i+0.5))-bw/2; let y=H-pb;
    for(const [k,c] of [['h','var(--h)'],['r','var(--f)'],['t','var(--t)']]){ const h=(v[k]/max)*(H-pb-14); if(h>0){ y-=h; bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" fill="${c}"/>`; } }
    const tot=v.h+v.r+v.t; if(tot) bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--muted)">${f(tot)}</text>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="${i===6?'var(--ink)':'var(--muted)'}" font-weight="${i===6?700:400}">${i===6?'اليوم':['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'][parse(days[i]).getDay()]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="الآيات المنجزة في آخر سبعة أيام"><line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${bars}</svg>`;
}

/* how much of each kind of task was done, counting partial work (3 of 5 pages = 60%) */
function stepCard(){
  const tot={}, got={}, t=todayIso();
  for(const p of Object.values(state.plans)){ if(status(p)==='paused') continue; const c=compute(p), ds=datesOf(p);
    c.sessions.forEach((s,k)=>s.tasks.forEach(tk=>{ const g=gotOf(p,tk); if(ds[k]>t && !g) return; const n=stepsOf(tk);
      tot[tk.kind]=(tot[tk.kind]||0)+n; got[tk.kind]=(got[tk.kind]||0)+g; })); }
  const rows=['h','n','f','r','t'].filter(k=>tot[k]).map(k=>{ const u=k==='h'?2:1, pct=Math.round(got[k]/tot[k]*100);
    return `<div class="krow"><b class="kind ${k}">${KIND[k]}</b><div class="bar"><i style="width:${pct}%;background:var(--${k==='r'?'f':k})"></i></div><b>${f(pct)}٪</b>
      <small>${f(Math.round(got[k]/u*10)/10)} من ${f(Math.round(tot[k]/u*10)/10)} وجه</small></div>`; }).join('');
  return rows ? `<section class="card"><h3>نسبة الإنجاز حتى اليوم</h3><div class="small muted">تُحسب من كل ورد حلّ موعده، ويدخل فيها الإنجاز الجزئي.</div>${rows}</section>` : '';
}

/* search the ayat: letters only, so it finds a word whatever its diacritics */
const arNorm=t=>String(t).replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[ٱأإآٲٳ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
let QN=null;
const aqHist=()=>{ try{ return JSON.parse(localStorage.getItem('rafiq-aqh')||'[]'); }catch(e){ return []; } };
const aqKeep=q=>{ q=String(q||'').trim(); if(q.length<2) return; try{ localStorage.setItem('rafiq-aqh',JSON.stringify([q,...aqHist().filter(x=>x!==q)].slice(0,6))); }catch(e){} };
function aqResults(){
  const q=arNorm(ui.aq||''); if(q.length<2){ const hs=aqHist(); return hs.length?`<div class="small muted" style="margin:0 0 6px">آخر بحث</div><div class="aqhs">${hs.map(x=>`<button data-act="aqHs" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:`<p class="small muted" style="text-align:center">اكتب كلمة أو أكثر، ويطلع لك كل آية فيها الكلمة.</p>`; }
  if(!QT){ loadQuran().then(()=>{ const el=document.getElementById('aqr'); if(el) el.innerHTML=aqResults(); }).catch(()=>{}); return `<p class="small muted" style="text-align:center">جارٍ تجهيز البحث…</p>`; }
  if(!QN) QN=QT.map(arNorm);
  const ex=!!ui.aqx, rx=ex?new RegExp('(^| )'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$)'):null;
  const hits=[]; for(let i=0;i<QN.length;i++) if(ex?rx.test(QN[i]):QN[i].includes(q)) hits.push(i+1);
  if(!hits.length) return `<p class="small muted" style="text-align:center">ما لقينا آية فيها «${esc(ui.aq)}». جرّب تكتب الكلمة بدون «ال» أو بحروف أقل.</p>`;
  const toks=q.split(' '), ns=new Set(hits.map(id=>sOf[id]));
  const mark=id=>QT[id-1].split(' ').map(w=>{ const n=arNorm(w); return toks.some(t=>ex?n===t:n.includes(t))?`<b>${esc(w)}</b>`:esc(w); }).join(' ');
  let occ=0; for(const id of hits) for(const w of QT[id-1].split(' ')){ const n=arNorm(w); if(toks.some(t=>ex?n===t:n.includes(t))) occ++; }
  return `<div class="aqcnt"><span>السور <b>${f(ns.size)}</b></span><span>الآيات <b>${f(hits.length)}</b></span><span>تكرار الكلمة <b>${f(occ)}</b></span></div>${hits.length>100?'<p class="small muted" style="margin:0 0 8px">يظهر أول ١٠٠ آية</p>':''}
    <div class="mlist">${hits.slice(0,100).map(id=>`<a class="aqrow" href="#read-${pOf[id]}" data-act="aqGo" data-id="${id}"><span class="aqh">${NAMES[sOf[id]-1]} ${f(aNo[id])}<small>ص ${f(pOf[id])}</small></span><span class="aqt">${mark(id)}</span></a>`).join('')}</div>`;
}
/* the 240 quarters (أرباع الأحزاب), each with the start of its first ayah, as printed mushafs mark them with ۞ */
const RUBN=['','ربع الحزب','نصف الحزب','ثلاثة أرباع الحزب'];
function rubRows(){
  if(!QT) setTimeout(()=>loadQuran().then(()=>{ if(route()==='mindex'&&ui.mtab==='r') rerender(); }).catch(()=>{}),0);
  let h=''; for(let q=1;q<=240;q++){ const id=QD.hizbq[q], hz=Math.ceil(q/4), k=(q-1)%4;
    if(k===0 && hz%2===1) h+=`<div class="sec-l rubj">الجزء ${f((hz+1)/2)}</div>`;
    const w=QT?QT[id-1].split(' ').slice(0,5).join(' ')+'…':'';
    h+=`<a class="mrow" href="#read-${pOf[id]}" data-act="aqGo" data-id="${id}"><span class="mno${k?' rq':''}">${k?['','¼','½','¾'][k]:f(hz)}</span><span class="mnm">${k?RUBN[k]:'الحزب '+f(hz)}<small class="rubt">${w||`${NAMES[sOf[id]-1]} ${f(aNo[id])}`}</small></span><span class="mpg">${NAMES[sOf[id]-1]} ${f(aNo[id])}<br>ص ${f(pOf[id])}</span></a>`; }
  return h;
}
/* one box finds surahs by name and ayahs by any word in them */
function msFind(rows){
  const qq=arNorm(ui.mq||'').trim(); ui.aq=ui.mq||'';
  if(!qq){ const hs=aqHist(); return (hs.length?`<div class="aqhs">${hs.map(x=>`<button data-act="aqHs" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'')+`<div class="mlist">${rows}</div>`; }
  const ay = qq.length>=2 && !/^[0-9٠-٩]+$/.test(qq) ? `<div class="sec-l">الآيات</div><button class="toggle sm" data-act="aqX"><span>بحث مطابق (الكلمة كاملة فقط)</span><span class="circle ${ui.aqx?'on':''}"></span></button><div id="aqr">${aqResults()}</div>` : '';
  return (rows?`<div class="sec-l">السور</div><div class="mlist">${rows}</div>`:'')+ay+(!rows&&!ay?'<p class="muted" style="text-align:center">ما لقينا سورة بهذا الاسم</p>':'');
}

  if(!QT) setTimeout(()=>loadQuran().then(()=>{ const el=document.getElementById('moff'); if(el) el.innerHTML=offBadge(); }).catch(()=>{}),0);
  const fw=LBS().map(x=>({x,ids:mkOf(x.id)})).filter(y=>y.ids.length), fws=fw.length?`<div class="card"><div class="tile-row" style="margin-bottom:8px"><span class="small muted">العلامات</span><button class="linkbtn" data-act="lbList">الكل</button></div><div class="mkls">${fw.map(({x,ids})=>ids.slice(-3).map(id=>`<a class="mkl mk-${x.c}" href="#read-${pOf[id]}"><i></i>${esc(x.n)} · ${NAMES[sOf[id]-1]} ${f(aNo[id])}</a>`).join('')).join('')}</div></div>`:'';
  const nts=Object.keys(NOTES()).length, ntc=nts?`<button class="listbtn" data-act="notesOpen"><span>الملاحظات<small>${plural(nts,'ملاحظة واحدة','ملاحظتان','ملاحظات','ملاحظة')} على الآيات</small></span><i class="chev">${IC.back}</i></button>`:'';
  return topbar('فهرس المصحف',{back:'#read-'+(lp||1)})+`<div class="stack">${cont}${fws}${ntc}
    <div class="tabs2">${[['s','السور'],['j','الأجزاء'],['r','الأرباع']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="mtab" data-k="${k}">${l}</button>`).join('')}</div>
    ${tab==='s'&&RSUR().length?`<div class="rschips">${RSUR().map(x=>`<a href="#read-${surahStartPage(x)}">${NAMES[x-1]}</a>`).join('')}</div>`:''}
    ${tab==='s'?`<label class="field small"><input id="mq" type="search" placeholder="ابحث عن سورة أو كلمة من آية" value="${esc(ui.mq||'')}" autocomplete="off"></label>`:''}
    ${tab==='s'?msFind(rows):`<div class="mlist">${rows}</div>`}
    <div class="card"><div class="small muted" style="margin-bottom:8px">تقليب الصفحات</div><div class="tabs2">${[['h','يمين ويسار'],['v','فوق وتحت']].map(([k,l])=>`<button class="${flipDir()===k?'on':''}" data-act="flipDir" data-k="${k}">${l}</button>`).join('')}</div></div>

    <p class="small muted" id="moff" style="text-align:center;margin:0">${offBadge()}</p></div>`;
}

function tafsFill(r){
  document.querySelectorAll('.tatf[data-k]').forEach(el=>{ const id=+el.dataset.id, k=el.dataset.k, body=el.querySelector('.tfb'), tt=el.querySelector('.tft b');
    (k==='g'?gharibOf(id):tafsirOf(id,k)).then(t=>{ if(route()!==r) return; const ps=String(t||'').replace(/<[^>]*>/g,'').split(/\n+/).filter(x=>x.trim());
      if(k!=='g'){ const A=TF[k+'/'+sOf[id]]||[], i=aNo[id]-1, T=j=>String(A[j]||'').trim(), cur=T(i); // one explanation can cover several ayat (empty or repeated text)
        let st=i; while(cur && st>0 && T(st-1)===cur) st--;
        if(cur && st<i){ body.innerHTML=`<p class="muted">فسّرها مع الآية ${f(st+1)}، شوف تفسيرها فوق.</p>`; return; }
        if(!cur){ let b=i; while(b>0 && !T(b)) b--; if(b<i && T(b)){ body.innerHTML=`<p class="muted">فسّرها مع الآية ${f(b+1)}، شوف تفسيرها فوق.</p>`; return; } }
        if(ps.length){ let e=i; while(e+1<A.length && (!T(e+1)||T(e+1)===cur)) e++; if(e>i) tt.innerHTML=`${tfName(k)} <small>محتوى الآيات (${f(i+1)}-${f(e+1)})</small>`; } }
      body.innerHTML=ps.length?ps.map(x=>`<p dir="auto">${tfFmt(x)}</p>`).join(''):`<p class="muted">${k==='g'?'ما فيه كلمات غريبة في هذي الآية.':'ما فيه تفسير لهذي الآية في هذا الكتاب.'}</p>`; })
    .catch(()=>{ body.innerHTML='<p class="muted">يحتاج إنترنت أول مرة لكل سورة، أو حمّل الكتاب من المكتبة.</p>'; }); });
}

  let d=dg.v?e.touches[0].clientY-dg.y:e.touches[0].clientX-dg.x; const n=dg.v?(d<0?1:-1):(d>0?1:-1), to=dg.p+n;

/* ---------- recitation check (speech recognition) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const AR_MARKS=/[ؐ-ًؚ-ٟۖ-ۭـ]/g;
function qnorm(w){
  return w.replace(/وٰ/g,'ا').replace(/ٰ/g,'').replace(AR_MARKS,'').replace(/[ٱأإآ]/g,'ا').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^ء-ي]/g,'');
}
const MUQ={'ا':'الف','ل':'لام','م':'ميم','ص':'صاد','ر':'را','ك':'كاف','ه':'ها','ي':'يا','ع':'عين','ط':'طا','س':'سين','ح':'حا','ق':'قاف','ن':'نون'};
const MUQ_SET=new Set(['الم','المص','الر','المر','كهيعص','طه','طسم','طس','يس','ص','حم','عسق','ق','ن']);
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const sim=(a,b)=>{ if(a===b) return 1; const L=Math.max(a.length,b.length); return L?1-lev(a,b)/L:0; };
function wordSim(e,r){ let s=Math.max(sim(e.n,r), e.alt?sim(e.alt,r):0);
  if(e.n.length>3 && r.startsWith('و')!==e.n.startsWith('و')) s=Math.max(s, sim(e.n.replace(/^و/,''), r.replace(/^و/,''))-0.15);
  return s; }
const OK_AT=e=>e.n.length<=3?0.66:0.72;
function buildWords(rs){
  const W=[]; for(const [a,b] of rs) for(let id=a;id<=b;id++){
    const ws=QT[id-1].split(/\s+/).filter(w=>qnorm(w)); ws.forEach((w,k)=>{ const n=qnorm(w); const e={t:w,n,id,last:k===ws.length-1,st:'p',hint:W.length===0};
      if(k===0 && aNo[id]===1 && MUQ_SET.has(n)) e.alt=[...n].map(c=>MUQ[c]||c).join('');
      W.push(e); }); }
  return W;
}
/* align what was heard with the expected words, left to right */
function alignRec(W,text,final){
  const R=text.split(/\s+/).map(qnorm).filter(Boolean);
  W.forEach(w=>{ w.st='p'; w.heard=null; });
  let i=0;
  for(let j=0;j<R.length && i<W.length;j++){
    const cands=[[R[j],1]]; if(j+1<R.length) cands.push([R[j]+R[j+1],2]); if(j+2<R.length) cands.push([R[j]+R[j+1]+R[j+2],3]);
    let best=null;
    for(let k=i;k<Math.min(W.length,i+6);k++){
      for(const [r,used] of cands){
        let s=wordSim(W[k],r), span=1;
        if(k+1<W.length){ const s2=wordSim({n:W[k].n+W[k+1].n},r); if(s2>s+0.05){ s=s2; span=2; } }
        const need = k===i ? OK_AT(W[k]) : Math.max(0.86, OK_AT(W[k]));
        if(s>=need && (k===i || W[k].n.length>=3) && (!best || k<best.k || (k===best.k && s>best.s))){ best={k,s,used,span}; }
      }
      if(best && best.k===k) break;
    }
    if(best){ for(let x=i;x<best.k;x++) W[x].st='m';
      for(let x=best.k;x<best.k+best.span;x++) W[x].st='ok';
      i=best.k+best.span; j+=best.used-1; }
    else if(sim(W[i].n,R[j])>=0.34 || (R.length-j)<=1){ W[i].heard=R[j]; W[i].st=(!final && j===R.length-1)?'c':'e'; if(W[i].st!=='c') i++; }
  }
  return i;
}
function recRoute(r){ return r.slice(7).split('_').map(x=>x.split('-').map(Number)).filter(x=>x.length===2&&x[0]>=1&&x[1]<=NA&&x[0]<=x[1]); }
function vRecite(r){
  const rs=recRoute(r); if(!rs.length) return topbar('التسميع',{back:'#mushaf'})+'<p class="muted">ما لقينا الآيات.</p>';
  const key=r; if(!ui.rc || ui.rc.key!==key){ stopRec(); ui.rc={key,rs,hide:true,on:false,segs:[],done:false,from:ui.rcFrom||null}; ui.rcFrom=null; }
  const rc=ui.rc, label=rs.map(runLabel).join('، ');
  if(!QT){ loadQuran().then(()=>{ if(route()===r) rerender(); }).catch(()=>{ const el=document.getElementById('mload'); if(el) el.textContent='تحتاج اتصال إنترنت أول مرة لتحميل المصحف.'; });
    return topbar('التسميع',{back:'#mushaf',sub:label})+'<div class="mload" id="mload">جارٍ تحميل الآيات…</div>'; }

  return topbar('التسميع',{back,sub:label})+`<div class="stack rc">
    ${SR?'':`<div class="card warnc">التسميع بالصوت غير مدعوم في هذا المتصفح. على الآيفون افتح الموقع من سفاري، وعلى أندرويد من كروم.</div>`}

      <button class="btn ghost sm" data-act="rcHint" ${rc.done?'disabled':''}>تلميح</button>
      <button class="mic ${rc.on?'on':''}" data-act="rcMic" aria-label="${rc.on?'إيقاف':'ابدأ التسميع'}" ${SR?'':'disabled'}>${IC.mic}</button>
      <button class="btn ghost sm" data-act="rcReset">من جديد</button>
    </div>
    <p class="small muted" id="rcst" style="text-align:center;margin:0">${rc.msg||(rc.on?'أسمعك… اقرأ بصوت واضح':'اضغط المايكروفون وابدأ القراءة')}</p></div>`;
}
function rcWords(){
  const W=ui.rc.W; let h='';
